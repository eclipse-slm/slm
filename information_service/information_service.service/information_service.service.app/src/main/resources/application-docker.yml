### Hostnames of the containers deployed by https://github.com/eclipse-slm/ansible-collection-slm

### Spring
spring:
  rabbitmq:
    host: rabbitmq
    port: 5672

### AAS
aas:
  broker:
    host: aas-broker
    port: 1884
  aas-registry:
    host: aas-registry
    port: 8082
  aas-repository:
    host: aas-environment
    port: 8081
  submodel-registry:
    host: submodel-registry
    port: 8083
  submodel-repository:
    host: aas-environment
    port: 8081
  concept-descriptions-repository:
    host: aas-environment
    port: 8081

### Information Receiving Service (IRS)
irs:
  host:
    internal: irs
  port:
    internal: 8080
  path:
    internal: /irs

### Consul
consul:
  service:
    address: information-service
  host: consul
  port: 8500
