---
components:
  schemas:
    Action:
      discriminator:
        propertyName: "actionClass"
      properties:
        actionClass:
          type: "string"
        actionType:
          $ref: "#/components/schemas/ActionType"
        configParameters:
          items:
            $ref: "#/components/schemas/ActionConfigParameter"
          type: "array"
        connectionTypes:
          items:
            $ref: "#/components/schemas/ConnectionType"
          type: "array"
          uniqueItems: true
        skipable:
          type: "boolean"
      type: "object"
    ActionConfigParameter:
      properties:
        defaultValue:
          type: "string"
        description:
          type: "string"
        name:
          type: "string"
        prettyName:
          type: "string"
        requiredType:
          $ref: "#/components/schemas/ActionConfigParameterRequiredType"
        secret:
          type: "boolean"
        valueType:
          $ref: "#/components/schemas/ActionConfigParameterValueType"
      type: "object"
    ActionConfigParameterRequiredType:
      enum:
      - "ALWAYS"
      - "SKIP"
      type: "string"
    ActionConfigParameterValueType:
      enum:
      - "SERVICE_PORT"
      - "STRING"
      - "FILE"
      - "KUBE_CONF"
      type: "string"
    ActionType:
      enum:
      - "RUN"
      type: "string"
    AdministrativeInformation:
      properties:
        creator:
          $ref: "#/components/schemas/Reference"
        embeddedDataSpecifications:
          items:
            $ref: "#/components/schemas/EmbeddedDataSpecification"
          type: "array"
        revision:
          type: "string"
        templateId:
          type: "string"
        version:
          type: "string"
      type: "object"
    AssetAdministrationShell:
      properties:
        administration:
          $ref: "#/components/schemas/AdministrativeInformation"
        assetInformation:
          $ref: "#/components/schemas/AssetInformation"
        category:
          type: "string"
        derivedFrom:
          $ref: "#/components/schemas/Reference"
        description:
          items:
            $ref: "#/components/schemas/LangStringTextType"
          type: "array"
        displayName:
          items:
            $ref: "#/components/schemas/LangStringNameType"
          type: "array"
        embeddedDataSpecifications:
          items:
            $ref: "#/components/schemas/EmbeddedDataSpecification"
          type: "array"
        extensions:
          items:
            $ref: "#/components/schemas/Extension"
          type: "array"
        id:
          type: "string"
        idShort:
          type: "string"
        submodels:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
      type: "object"
    AssetAdministrationShellDescriptor:
      properties:
        administration:
          $ref: "#/components/schemas/AdministrativeInformation"
        assetKind:
          $ref: "#/components/schemas/AssetKind"
        assetType:
          type: "string"
        description:
          items:
            $ref: "#/components/schemas/LangStringTextType"
          type: "array"
        displayName:
          items:
            $ref: "#/components/schemas/LangStringNameType"
          type: "array"
        endpoints:
          items:
            $ref: "#/components/schemas/Endpoint"
          type: "array"
        extensions:
          items:
            $ref: "#/components/schemas/Extension"
          type: "array"
        globalAssetId:
          type: "string"
        id:
          type: "string"
        idShort:
          type: "string"
        specificAssetIds:
          items:
            $ref: "#/components/schemas/SpecificAssetId"
          type: "array"
        submodelDescriptors:
          items:
            $ref: "#/components/schemas/SubmodelDescriptor"
          type: "array"
      type: "object"
    AssetInformation:
      properties:
        assetKind:
          $ref: "#/components/schemas/AssetKind"
        assetType:
          type: "string"
        defaultThumbnail:
          $ref: "#/components/schemas/Resource"
        globalAssetId:
          type: "string"
        specificAssetIds:
          items:
            $ref: "#/components/schemas/SpecificAssetId"
          type: "array"
      type: "object"
    AssetKind:
      enum:
      - "INSTANCE"
      - "NOT_APPLICABLE"
      - "TYPE"
      type: "string"
    AwxAction:
      allOf:
      - $ref: "#/components/schemas/Action"
      - properties:
          awxBranch:
            type: "string"
          awxRepo:
            type: "string"
          parameter:
            items:
              $ref: "#/components/schemas/SurveyItem"
            type: "array"
          password:
            type: "string"
            writeOnly: true
          playbook:
            type: "string"
          username:
            type: "string"
            writeOnly: true
        type: "object"
      type: "object"
    Base64UrlEncodedCursor:
      properties:
        decodedCursor:
          type: "string"
        encodedCursor:
          type: "string"
      type: "object"
    Base64UrlEncodedIdentifier:
      properties:
        encodedIdentifier:
          type: "string"
        identifier:
          type: "string"
      type: "object"
    BaseConfigurationCapability:
      allOf:
      - $ref: "#/components/schemas/Capability"
      type: "object"
    BaseConfigurationCapabilityDTOApi:
      allOf:
      - $ref: "#/components/schemas/CapabilityDTOApi"
      type: "object"
    Capability:
      discriminator:
        propertyName: "capabilityClass"
      properties:
        actions:
          additionalProperties:
            oneOf:
            - $ref: "#/components/schemas/AwxAction"
          type: "object"
        capabilityClass:
          type: "string"
        cluster:
          type: "boolean"
        clusterMemberTypes:
          items:
            $ref: "#/components/schemas/ClusterMemberType"
          type: "array"
        connection:
          $ref: "#/components/schemas/ConnectionType"
        connectionTypes:
          items:
            $ref: "#/components/schemas/ConnectionType"
          type: "array"
          uniqueItems: true
        executionEnvironment:
          $ref: "#/components/schemas/ExecutionEnvironment"
        id:
          format: "uuid"
          type: "string"
        logo:
          type: "string"
        name:
          type: "string"
        type:
          items:
            $ref: "#/components/schemas/CapabilityType"
          type: "array"
      type: "object"
    CapabilityDTOApi:
      discriminator:
        propertyName: "capabilityClass"
      properties:
        actions:
          additionalProperties:
            oneOf:
            - $ref: "#/components/schemas/AwxAction"
          type: "object"
        capabilityClass:
          type: "string"
        connection:
          $ref: "#/components/schemas/ConnectionType"
        executionEnvironment:
          $ref: "#/components/schemas/ExecutionEnvironment"
        id:
          format: "uuid"
          type: "string"
        logo:
          type: "string"
        name:
          type: "string"
        type:
          items:
            $ref: "#/components/schemas/CapabilityType"
          type: "array"
      type: "object"
    CapabilityFilter:
      properties:
        capabilityHostType:
          $ref: "#/components/schemas/CapabilityHostType"
        capabilityId:
          format: "uuid"
          type: "string"
      type: "object"
    CapabilityGitImportRequest:
      properties:
        branch:
          type: "string"
        filePath:
          type: "string"
        repositoryUrl:
          type: "string"
      type: "object"
    CapabilityHostType:
      enum:
      - "SINGLE_HOST"
      - "MULTI_HOST"
      type: "string"
    CapabilityJobDTO:
      properties:
        capabilityId:
          format: "uuid"
          type: "string"
        configParameters:
          additionalProperties:
            type: "string"
          type: "object"
        createdAt:
          format: "date-time"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        logMessages:
          items:
            type: "string"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        skipInstall:
          type: "boolean"
        state:
          $ref: "#/components/schemas/CapabilityJobState"
        stateTransitions:
          items:
            $ref: "#/components/schemas/CapabilityJobStateTransition"
          type: "array"
      type: "object"
    CapabilityJobState:
      enum:
      - "CREATED"
      - "INSTALLING"
      - "INSTALLED"
      - "UNINSTALLING"
      - "UNINSTALLED"
      - "FAILED"
      type: "string"
    CapabilityJobStateTransition:
      properties:
        fromState:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        timestamp:
          format: "date-time"
          type: "string"
        toState:
          type: "string"
      type: "object"
    CapabilityService:
      discriminator:
        propertyName: "capabilityServiceClass"
      properties:
        ID:
          type: "string"
        Namespace:
          type: "string"
        Port:
          format: "int32"
          type: "integer"
        Service:
          type: "string"
        TaggedAddresses:
          $ref: "#/components/schemas/TaggedAddresses"
        capability:
          oneOf:
          - $ref: "#/components/schemas/BaseConfigurationCapability"
          - $ref: "#/components/schemas/DeploymentCapability"
        capabilityServiceClass:
          type: "string"
        customMeta:
          additionalProperties:
            type: "string"
          type: "object"
        managed:
          type: "boolean"
        meta:
          additionalProperties:
            type: "string"
          type: "object"
        resourceId:
          format: "uuid"
          type: "string"
        serviceClass:
          type: "string"
        serviceId:
          format: "uuid"
          type: "string"
        status:
          $ref: "#/components/schemas/CapabilityServiceStatus"
        tags:
          items:
            type: "string"
          type: "array"
      required:
      - "capabilityServiceClass"
      type: "object"
    CapabilityServiceDTO:
      properties:
        capabilityClass:
          type: "string"
        capabilityId:
          format: "uuid"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        status:
          $ref: "#/components/schemas/CapabilityServiceStatus"
      type: "object"
    CapabilityServiceStatus:
      enum:
      - "INSTALL"
      - "READY"
      - "UNINSTALL"
      - "FAILED"
      - "UNKNOWN"
      type: "string"
    CapabilityType:
      enum:
      - "SETUP"
      - "DEPLOY"
      - "SCALE"
      - "VM"
      type: "string"
    Cluster:
      properties:
        capabilityService:
          $ref: "#/components/schemas/MultiHostCapabilityService"
        clusterMemberTypes:
          items:
            $ref: "#/components/schemas/ClusterMemberType"
          type: "array"
        clusterType:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        managed:
          type: "boolean"
        memberMapping:
          additionalProperties:
            type: "string"
          type: "object"
        metaData:
          additionalProperties:
            type: "string"
          type: "object"
        name:
          type: "string"
        nodes:
          items:
            $ref: "#/components/schemas/Node"
          type: "array"
      type: "object"
    ClusterCreateRequest:
      properties:
        clusterMembers:
          additionalProperties:
            type: "string"
          type: "object"
        clusterTypeId:
          format: "uuid"
          type: "string"
        configParameterValues:
          additionalProperties:
            type: "string"
          type: "object"
        fullPathOwnerGroupId:
          type: "string"
        skipInstall:
          type: "boolean"
      type: "object"
    ClusterMemberType:
      properties:
        minNumber:
          format: "int32"
          type: "integer"
        name:
          type: "string"
        prettyName:
          type: "string"
        scalable:
          type: "boolean"
      type: "object"
    ConnectionType:
      enum:
      - "ssh"
      - "WinSsh"
      - "WinRM"
      - "http"
      - "tcp"
      type: "string"
    ConnectionTypeDTO:
      properties:
        defaultPort:
          format: "int32"
          type: "integer"
        name:
          type: "string"
        prettyName:
          type: "string"
        remote:
          type: "boolean"
      type: "object"
    CreateResourceRequest:
      properties:
        digitalNameplateV3:
          $ref: "#/components/schemas/DigitalNameplateV3"
        fullPathOwnerGroupId:
          type: "string"
        resourceHostname:
          type: "string"
        resourceIp:
          type: "string"
      type: "object"
    CredentialDataKeyPairReadDTO:
      allOf:
      - $ref: "#/components/schemas/CredentialDataReadDTO"
      - properties:
          publicKey:
            type: "string"
        type: "object"
      type: "object"
    CredentialDataReadDTO:
      discriminator:
        propertyName: "credentialDataType"
      properties:
        credentialDataType:
          $ref: "#/components/schemas/CredentialDataType"
      type: "object"
    CredentialDataType:
      enum:
      - "USERNAME_PASSWORD"
      - "KEY_PAIR"
      type: "string"
    CredentialDataUsernamePasswordReadDTO:
      allOf:
      - $ref: "#/components/schemas/CredentialDataReadDTO"
      - properties:
          username:
            type: "string"
        type: "object"
      type: "object"
    CredentialEntityLinkReadDTO:
      properties:
        entityId:
          type: "string"
        entityType:
          type: "string"
      type: "object"
    CredentialReadDTO:
      properties:
        data:
          oneOf:
          - $ref: "#/components/schemas/CredentialDataKeyPairReadDTO"
          - $ref: "#/components/schemas/CredentialDataUsernamePasswordReadDTO"
        entityLinks:
          items:
            $ref: "#/components/schemas/CredentialEntityLinkReadDTO"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        scopesRaw:
          items:
            type: "string"
          type: "array"
      type: "object"
    DataSpecificationContent:
      type: "object"
    DataTypeDefXsd:
      enum:
      - "ANY_URI"
      - "BASE64BINARY"
      - "BOOLEAN"
      - "BYTE"
      - "DATE"
      - "DATE_TIME"
      - "DECIMAL"
      - "DOUBLE"
      - "DURATION"
      - "FLOAT"
      - "GDAY"
      - "GMONTH"
      - "GMONTH_DAY"
      - "GYEAR"
      - "GYEAR_MONTH"
      - "HEX_BINARY"
      - "INT"
      - "INTEGER"
      - "LONG"
      - "NEGATIVE_INTEGER"
      - "NON_NEGATIVE_INTEGER"
      - "NON_POSITIVE_INTEGER"
      - "POSITIVE_INTEGER"
      - "SHORT"
      - "STRING"
      - "TIME"
      - "UNSIGNED_BYTE"
      - "UNSIGNED_INT"
      - "UNSIGNED_LONG"
      - "UNSIGNED_SHORT"
      type: "string"
    DeploymentCapability:
      allOf:
      - $ref: "#/components/schemas/Capability"
      - properties:
          supportedDeploymentTypes:
            items:
              $ref: "#/components/schemas/DeploymentType"
            type: "array"
        type: "object"
      type: "object"
    DeploymentCapabilityDTOApi:
      allOf:
      - $ref: "#/components/schemas/CapabilityDTOApi"
      - properties:
          supportedDeploymentTypes:
            items:
              $ref: "#/components/schemas/DeploymentType"
            type: "array"
        type: "object"
      type: "object"
    DeploymentType:
      enum:
      - "DOCKER_CONTAINER"
      - "DOCKER_COMPOSE"
      - "KUBERNETES"
      - "CODESYS"
      type: "string"
    DigitalNameplateV3:
      properties:
        addressInformation:
          type: "string"
        countryOfOrigin:
          type: "string"
        dateOfManufacture:
          format: "date-time"
          type: "string"
        firmwareVersion:
          type: "string"
        hardwareVersion:
          type: "string"
        manufacturerName:
          type: "string"
        manufacturerProductDesignation:
          type: "string"
        manufacturerProductFamily:
          type: "string"
        manufacturerProductRoot:
          type: "string"
        manufacturerProductType:
          type: "string"
        orderCodeOfManufacturer:
          type: "string"
        productArticleNumberOfManufacturer:
          type: "string"
        serialNumber:
          type: "string"
        softwareVersion:
          type: "string"
        uniqueFacilityIdentifier:
          type: "string"
        uriOfTheProduct:
          type: "string"
        yearOfConstruction:
          type: "string"
      type: "object"
    DiscoveredResource:
      properties:
        connectionParameters:
          type: "string"
        firmwareVersion:
          type: "string"
        id:
          type: "string"
        ignored:
          type: "boolean"
        ipAddress:
          type: "string"
        macAddress:
          type: "string"
        manufacturerName:
          type: "string"
        name:
          type: "string"
        productName:
          type: "string"
        resourceId:
          format: "uuid"
          type: "string"
        serialNumber:
          type: "string"
      type: "object"
    DiscoveredResourceDTO:
      properties:
        discoveryJobId:
          format: "uuid"
          type: "string"
        firmwareVersion:
          type: "string"
        id:
          type: "string"
        ignored:
          type: "boolean"
        ipAddress:
          type: "string"
        macAddress:
          type: "string"
        manufacturerName:
          type: "string"
        name:
          type: "string"
        onboarded:
          type: "boolean"
        productName:
          type: "string"
        resourceId:
          format: "uuid"
          type: "string"
        resultId:
          type: "string"
        serialNumber:
          type: "string"
      type: "object"
    DiscoveryJob:
      properties:
        discoveryResult:
          items:
            $ref: "#/components/schemas/DiscoveredResource"
          type: "array"
        driverId:
          type: "string"
        finishDate:
          format: "date-time"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        startDate:
          format: "date-time"
          type: "string"
        state:
          $ref: "#/components/schemas/DiscoveryJobState"
      type: "object"
    DiscoveryJobStartedResponse:
      properties:
        discoveryJobId:
          format: "uuid"
          type: "string"
      type: "object"
    DiscoveryJobState:
      enum:
      - "CREATED"
      - "IN_PROGRESS"
      - "COMPLETED"
      - "FAILED"
      type: "string"
    DiscoveryRequest:
      properties:
        filterValues:
          additionalProperties:
            type: "string"
          type: "object"
        optionValues:
          additionalProperties:
            type: "string"
          type: "object"
      type: "object"
    DiscoveryRequestFilter:
      properties:
        dataType:
          type: "string"
        defaultValue:
          type: "string"
        description:
          type: "string"
        key:
          type: "string"
      type: "object"
    DiscoveryRequestOption:
      properties:
        dataType:
          type: "string"
        defaultValue:
          type: "string"
        description:
          type: "string"
        key:
          type: "string"
      type: "object"
    DriverInfo:
      properties:
        discoveryRequestFilters:
          items:
            $ref: "#/components/schemas/DiscoveryRequestFilter"
          type: "array"
        discoveryRequestOptions:
          items:
            $ref: "#/components/schemas/DiscoveryRequestOption"
          type: "array"
        domainName:
          type: "string"
        instanceId:
          type: "string"
        ipv4Address:
          type: "string"
        name:
          type: "string"
        portNumber:
          format: "int32"
          type: "integer"
        vendorName:
          type: "string"
        version:
          type: "string"
      type: "object"
    EmbeddedDataSpecification:
      properties:
        dataSpecification:
          $ref: "#/components/schemas/Reference"
        dataSpecificationContent:
          $ref: "#/components/schemas/DataSpecificationContent"
      type: "object"
    Endpoint:
      properties:
        get_interface:
          type: "string"
        protocolInformation:
          $ref: "#/components/schemas/ProtocolInformation"
      type: "object"
    ExecutionEnvironment:
      properties:
        description:
          type: "string"
        image:
          type: "string"
        pull:
          $ref: "#/components/schemas/ExecutionEnvironmentPull"
        registryCredential:
          $ref: "#/components/schemas/RegistryCredentials"
      type: "object"
    ExecutionEnvironmentPull:
      enum:
      - ""
      - "always"
      - "missing"
      - "never"
      type: "string"
    Extension:
      properties:
        name:
          type: "string"
        refersTo:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
        semanticId:
          $ref: "#/components/schemas/Reference"
        supplementalSemanticIds:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
        value:
          type: "string"
        valueType:
          $ref: "#/components/schemas/DataTypeDefXsd"
      type: "object"
    FirmwareUpdateFile:
      properties:
        downloadUrl:
          type: "string"
        fileName:
          type: "string"
        fileSizeBytes:
          format: "int64"
          type: "integer"
        uploadDate:
          format: "date-time"
          type: "string"
      type: "object"
    FirmwareUpdateJob:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        driverId:
          type: "string"
        failureReason:
          $ref: "#/components/schemas/FirmwareUpdateJobFailureReason"
        id:
          format: "uuid"
          type: "string"
        logMessages:
          items:
            type: "string"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        softwareNameplateId:
          type: "string"
        state:
          $ref: "#/components/schemas/FirmwareUpdateJobState"
        stateTransitions:
          items:
            $ref: "#/components/schemas/FirmwareUpdateJobStateTransition"
          type: "array"
        userId:
          type: "string"
      type: "object"
    FirmwareUpdateJobFailureReason:
      enum:
      - "UNKNOWN_ERROR"
      - "INVALID_CREDENTIALS"
      - "FIRMWARE_VERSION_ALREADY_INSTALLED"
      type: "string"
    FirmwareUpdateJobState:
      enum:
      - "CREATED"
      - "PREPARING"
      - "PREPARED"
      - "ACTIVATING"
      - "ACTIVATED"
      - "CANCELING"
      - "CANCELED"
      - "FAILED"
      type: "string"
    FirmwareUpdateJobStateTransition:
      properties:
        fromState:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        timestamp:
          format: "date-time"
          type: "string"
        toState:
          type: "string"
      type: "object"
    FirmwareUpdateStatus:
      enum:
      - "UP_TO_DATE"
      - "UPDATE_AVAILABLE"
      - "UNKNOWN"
      type: "string"
    FirmwareVersionDetails:
      properties:
        date:
          type: "string"
        firmwareUpdateFile:
          $ref: "#/components/schemas/FirmwareUpdateFile"
        installationChecksum:
          type: "string"
        installationUri:
          type: "string"
        softwareNameplateSubmodelId:
          type: "string"
        version:
          type: "string"
      type: "object"
    GetReferencesResult:
      properties:
        paging_metadata:
          $ref: "#/components/schemas/PagedResultPagingMetadata"
        result:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
      type: "object"
    GetSubmodelsResult:
      properties:
        paging_metadata:
          $ref: "#/components/schemas/PagedResultPagingMetadata"
        result:
          items:
            $ref: "#/components/schemas/Submodel"
          type: "array"
      type: "object"
    GetSubmodelsValueOnlyResult:
      additionalProperties:
        type: "object"
      properties:
        empty:
          type: "boolean"
      type: "object"
    Key:
      properties:
        type:
          $ref: "#/components/schemas/KeyTypes"
        value:
          type: "string"
      type: "object"
    KeyTypes:
      enum:
      - "ANNOTATED_RELATIONSHIP_ELEMENT"
      - "ASSET_ADMINISTRATION_SHELL"
      - "BASIC_EVENT_ELEMENT"
      - "BLOB"
      - "CAPABILITY"
      - "CONCEPT_DESCRIPTION"
      - "DATA_ELEMENT"
      - "ENTITY"
      - "EVENT_ELEMENT"
      - "FILE"
      - "FRAGMENT_REFERENCE"
      - "GLOBAL_REFERENCE"
      - "IDENTIFIABLE"
      - "MULTI_LANGUAGE_PROPERTY"
      - "OPERATION"
      - "PROPERTY"
      - "RANGE"
      - "REFERABLE"
