info:
  contact:
    email: "matthias.schneider@ipa.fraunhofer.de"
    name: "Fraunhofer IPA"
    url: "https://www.ipa.fraunhofer.de"
  description: "REST API of Resource Management"
  title: "Resource Management"
  version: "1.5.0-SNAPSHOT"
openapi: "3.0.1"
paths:
  /aas/submodels/templates/{smTemplateSemanticId}/instances:
    get:
      operationId: "getSubmodelTemplateInstancesBySemanticId"
      parameters:
      - description: "The semantic id to search for submodel instances (UTF8-BASE64-URL-encoded)"
        in: "path"
        name: "smTemplateSemanticId"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "filterByAasId"
        required: false
        schema:
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: "string"
          description: "OK"
      summary: "Get instances of submodel templates using semantic id"
      tags:
      - "Submodel Templates"
  /importer/capabilities:
    post:
      operationId: "importCapabilitiesFromFile"
      parameters:
      - in: "query"
        name: "forceInstall"
        required: false
        schema:
          default: false
          type: "boolean"
      - in: "query"
        name: "fullPathOwnerGroupId"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: "binary"
                  type: "string"
              required:
              - "file"
              type: "object"
      responses:
        "200":
          description: "OK"
      summary: "Import capabilities from file"
      tags:
      - "Importer"
  /importer/resources:
    post:
      operationId: "importFromFile"
      parameters:
      - in: "query"
        name: "fullPathOwnerGroupId"
        required: true
        schema:
          type: "string"
      requestBody:
        content:
          multipart/form-data:
            schema:
              properties:
                file:
                  format: "binary"
                  type: "string"
              required:
              - "file"
              type: "object"
      responses:
        "200":
          description: "OK"
      summary: "Import resources from file"
      tags:
      - "Importer"
  /jobs:
    get:
      operationId: "getJobs"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: "object"
          description: "OK"
      tags:
      - "Jobs"
  /metrics/{resourceId}:
    get:
      operationId: "getMetric"
      parameters:
      - in: "path"
        name: "resourceId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                additionalProperties:
                  type: "object"
                type: "object"
          description: "OK"
      tags:
      - "Metrics"
  /resources:
    get:
      operationId: "getResources"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ResourceDTO"
                type: "array"
          description: "OK"
      summary: "Get all resources"
      tags:
      - "Resources"
    post:
      operationId: "addExistingResource"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateResourceRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                format: "uuid"
                type: "string"
          description: "OK"
      summary: "Add existing resource"
      tags:
      - "Resources"
  /resources/aas:
    get:
      operationId: "getResourceAASDescriptors"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/AssetAdministrationShell"
                type: "array"
          description: "OK"
      summary: "Get all AAS of resources"
      tags:
      - "Resources AAS"
  /resources/capabilities:
    get:
      operationId: "getCapabilities"
      parameters:
      - in: "query"
        name: "arg0"
        required: false
        schema:
          $ref: "#/components/schemas/CapabilityFilter"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  oneOf:
                  - $ref: "#/components/schemas/BaseConfigurationCapabilityDTOApi"
                  - $ref: "#/components/schemas/DeploymentCapabilityDTOApi"
                type: "array"
          description: "OK"
      summary: "Get capabilities"
      tags:
      - "Capabilities"
    post:
      operationId: "createCapability"
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: "#/components/schemas/BaseConfigurationCapabilityDTOApi"
              - $ref: "#/components/schemas/DeploymentCapabilityDTOApi"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Add capability"
      tags:
      - "Capabilities"
  /resources/capabilities/import-from-git:
    post:
      operationId: "importCapabilityFromGit"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapabilityGitImportRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/BaseConfigurationCapabilityDTOApi"
                - $ref: "#/components/schemas/DeploymentCapabilityDTOApi"
          description: "OK"
      summary: "Import capability definition from git repository"
      tags:
      - "Capabilities"
  /resources/capabilities/services:
    get:
      operationId: "getAllCapabilityServices"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/CapabilityServiceDTO"
                type: "array"
          description: "OK"
      summary: "Get all capability services"
      tags:
      - "Capabilities"
  /resources/capabilities/{capabilityId}:
    delete:
      operationId: "deleteCapability"
      parameters:
      - in: "path"
        name: "capabilityId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: "object"
          description: "OK"
      summary: "Delete capability"
      tags:
      - "Capabilities"
  /resources/clusters:
    get:
      operationId: "getClusterResources"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Cluster"
                type: "array"
          description: "OK"
      summary: "Get all cluster resources of user"
      tags:
      - "Clusters"
    post:
      operationId: "createClusterResource"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClusterCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Create a cluster"
      tags:
      - "Clusters"
  /resources/clusters/types:
    get:
      operationId: "getClusterTypes"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  oneOf:
                  - $ref: "#/components/schemas/BaseConfigurationCapabilityDTOApi"
                  - $ref: "#/components/schemas/DeploymentCapabilityDTOApi"
                type: "array"
          description: "OK"
      summary: "Get all available cluster types"
      tags:
      - "Clusters"
  /resources/clusters/{clusterName}/members:
    get:
      operationId: "getClusterMembers"
      parameters:
      - in: "path"
        name: "clusterName"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
