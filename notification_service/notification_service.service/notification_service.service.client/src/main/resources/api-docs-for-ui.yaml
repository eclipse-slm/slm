---
components:
  schemas:
    AasElementKind:
      enum:
      - "SHELL"
      - "SUBMODEL"
      - "SUBMODEL_REFERENCE"
      type: "string"
    AasEventNotification:
      properties:
        elementKind:
          $ref: "#/components/schemas/AasElementKind"
        eventType:
          $ref: "#/components/schemas/AasEventType"
        resourceId:
          format: "uuid"
          type: "string"
        semanticId:
          type: "string"
        shellId:
          type: "string"
        submodelId:
          type: "string"
        submodelIdShort:
          type: "string"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    AasEventType:
      enum:
      - "CREATED"
      - "UPDATED"
      - "DELETED"
      type: "string"
    CapabilityJobDTO:
      properties:
        capabilityId:
          format: "uuid"
          type: "string"
        configParameters:
          additionalProperties:
            type: "string"
          type: "object"
        createdAt:
          format: "date-time"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        logMessages:
          items:
            type: "string"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        skipInstall:
          type: "boolean"
        state:
          $ref: "#/components/schemas/CapabilityJobState"
        stateTransitions:
          items:
            $ref: "#/components/schemas/CapabilityJobStateTransition"
          type: "array"
      type: "object"
    CapabilityJobEventNotification:
      properties:
        capabilityJob:
          $ref: "#/components/schemas/CapabilityJobDTO"
        eventType:
          $ref: "#/components/schemas/CapabilityJobEventType"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    CapabilityJobEventType:
      enum:
      - "CHANGED"
      type: "string"
    CapabilityJobState:
      enum:
      - "CREATED"
      - "INSTALLING"
      - "INSTALLED"
      - "UNINSTALLING"
      - "UNINSTALLED"
      - "FAILED"
      type: "string"
    CapabilityJobStateTransition:
      properties:
        fromState:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        timestamp:
          format: "date-time"
          type: "string"
        toState:
          type: "string"
      type: "object"
    DiscoveredResource:
      properties:
        connectionParameters:
          type: "string"
        firmwareVersion:
          type: "string"
        id:
          type: "string"
        ignored:
          type: "boolean"
        ipAddress:
          type: "string"
        macAddress:
          type: "string"
        manufacturerName:
          type: "string"
        name:
          type: "string"
        productName:
          type: "string"
        resourceId:
          format: "uuid"
          type: "string"
        serialNumber:
          type: "string"
      type: "object"
    DiscoveryJobDTO:
      properties:
        discoveryResult:
          items:
            $ref: "#/components/schemas/DiscoveredResource"
          type: "array"
        driverId:
          type: "string"
        finishDate:
          format: "date-time"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        startDate:
          format: "date-time"
          type: "string"
        state:
          $ref: "#/components/schemas/DiscoveryJobState"
      type: "object"
    DiscoveryJobEventNotification:
      properties:
        discoveryJob:
          $ref: "#/components/schemas/DiscoveryJobDTO"
        eventType:
          $ref: "#/components/schemas/DiscoveryJobEventType"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    DiscoveryJobEventType:
      enum:
      - "CHANGED"
      type: "string"
    DiscoveryJobState:
      enum:
      - "CREATED"
      - "IN_PROGRESS"
      - "COMPLETED"
      - "FAILED"
      type: "string"
    EVENT_CLASS:
      enum:
      - "RESOURCE_EVENT"
      - "DISCOVERY_EVENT"
      - "CAPABILITY_JOB_EVENT"
      - "FIRMWARE_UPDATE_JOB_EVENT"
      - "SERVICE_INSTANCE_EVENT"
      - "AAS_EVENT"
      type: "string"
    EventNotificationModel:
      properties:
        aasEventNotification:
          $ref: "#/components/schemas/AasEventNotification"
        capabilityJobEventNotification:
          $ref: "#/components/schemas/CapabilityJobEventNotification"
        discoveryEventNotification:
          $ref: "#/components/schemas/DiscoveryJobEventNotification"
        eventClass:
          $ref: "#/components/schemas/EVENT_CLASS"
        eventNotification:
          oneOf:
          - $ref: "#/components/schemas/AasEventNotification"
          - $ref: "#/components/schemas/CapabilityJobEventNotification"
          - $ref: "#/components/schemas/DiscoveryJobEventNotification"
          - $ref: "#/components/schemas/FirmwareUpdateJobEventNotification"
          - $ref: "#/components/schemas/ResourceEventNotification"
          - $ref: "#/components/schemas/ServiceInstanceEventNotification"
        firmwareUpdateJobEventNotification:
          $ref: "#/components/schemas/FirmwareUpdateJobEventNotification"
        resourceEventNotification:
          $ref: "#/components/schemas/ResourceEventNotification"
        serviceInstanceEventNotification:
          $ref: "#/components/schemas/ServiceInstanceEventNotification"
      type: "object"
    FirmwareUpdateJobDTO:
      properties:
        createdAt:
          format: "date-time"
          type: "string"
        driverId:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        logMessages:
          items:
            type: "string"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        softwareNameplateId:
          type: "string"
        state:
          $ref: "#/components/schemas/FirmwareUpdateJobState"
        stateTransitions:
          items:
            $ref: "#/components/schemas/FirmwareUpdateJobStateTransition"
          type: "array"
      type: "object"
    FirmwareUpdateJobEventNotification:
      properties:
        eventType:
          $ref: "#/components/schemas/FirmwareUpdateJobEventType"
        firmwareUpdateJob:
          $ref: "#/components/schemas/FirmwareUpdateJobDTO"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    FirmwareUpdateJobEventType:
      enum:
      - "CHANGED"
      type: "string"
    FirmwareUpdateJobState:
      enum:
      - "CREATED"
      - "PREPARING"
      - "PREPARED"
      - "ACTIVATING"
      - "ACTIVATED"
      - "CANCELING"
      - "CANCELED"
      - "FAILED"
      type: "string"
    FirmwareUpdateJobStateTransition:
      properties:
        fromState:
          type: "string"
        id:
          format: "int64"
          type: "integer"
        timestamp:
          format: "date-time"
          type: "string"
        toState:
          type: "string"
      type: "object"
    JobGoal:
      enum:
      - "CREATE"
      - "DELETE"
      - "UPDATE"
      - "UPGRADE"
      - "MOVE"
      - "MODIFY"
      - "ADD"
      type: "string"
    JobTarget:
      enum:
      - "PROJECT"
      - "RESOURCE"
      - "SERVICE"
      - "DEPLOYMENT_CAPABILITY"
      - "BASE_CONFIGURATION_CAPABILITY"
      - "DISCOVERY"
      type: "string"
    Notification:
      properties:
        category:
          $ref: "#/components/schemas/NotificationCategory"
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        id:
          format: "int64"
          type: "integer"
        read:
          type: "boolean"
        subCategory:
          $ref: "#/components/schemas/NotificationSubCategory"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    NotificationCategory:
      enum:
      - "JOBS"
      - "RESOURCES"
      - "SERVICES"
      type: "string"
    NotificationEventType:
      enum:
      - "CREATED"
      - "DELETED"
      - "UPDATED"
      - "UPGRADED"
      - "MOVED"
      - "MODIFIED"
      - "ADDED"
      - "INSTALLED"
      - "UNINSTALLED"
      - "FAILED"
      type: "string"
    NotificationSubCategory:
      enum:
      - "RESOURCE"
      - "CLUSTER"
      - "SERVICE"
      - "JOB"
      - "CAPABILITY"
      - "DISCOVERY"
      - "FIRMWARE_UPDATE"
      type: "string"
    ResourceDTO:
      properties:
        assetId:
          type: "string"
        capabilityServiceIds:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        clusterMember:
          type: "boolean"
        driverId:
          type: "string"
        firmwareVersion:
          type: "string"
        hostname:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        ip:
          type: "string"
        locationId:
          format: "uuid"
          type: "string"
        remoteAccessAvailable:
          type: "boolean"
        remoteAccessIds:
          items:
            format: "uuid"
            type: "string"
          type: "array"
      type: "object"
    ResourceEventNotification:
      properties:
        eventType:
          $ref: "#/components/schemas/ResourceEventType"
        resource:
          $ref: "#/components/schemas/ResourceDTO"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    ResourceEventType:
      enum:
      - "CREATED"
      - "UPDATED"
      - "DELETED"
      type: "string"
    ServiceInstance:
      properties:
        capabilityServiceId:
          format: "uuid"
          type: "string"
        groupIds:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        metaData:
          additionalProperties:
            type: "string"
          type: "object"
        ports:
          items:
            format: "int32"
            type: "integer"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        serviceOfferingId:
          format: "uuid"
          type: "string"
        serviceOfferingVersionId:
          format: "uuid"
          type: "string"
        tags:
          items:
            type: "string"
          type: "array"
      type: "object"
    ServiceInstanceEventNotification:
      properties:
        eventType:
          $ref: "#/components/schemas/ServiceInstanceEventType"
        serviceInstance:
          $ref: "#/components/schemas/ServiceInstance"
        timestamp:
          format: "date-time"
          type: "string"
        userId:
          type: "string"
      type: "object"
    ServiceInstanceEventType:
      enum:
      - "CREATED"
      - "UPDATED"
      - "DELETED"
      type: "string"
  securitySchemes:
    bearer_auth:
      bearerFormat: "JWT"
      scheme: "bearer"
      type: "http"
    spring_oauth:
      description: "Oauth2 flow"
      flows:
        authorizationCode:
          authorizationUrl: ""
          refreshUrl: ""
          scopes: {}
          tokenUrl: ""
      type: "oauth2"
info:
  contact:
    email: "matthias.schneider@ipa.fraunhofer.de"
    name: "Fraunhofer IPA"
    url: "https://www.ipa.fraunhofer.de"
  description: "REST API of Notification Service"
  title: "Notification Service"
  version: "1.5.0-SNAPSHOT"
openapi: "3.0.1"
paths:
  /notification:
    post:
      operationId: "createNotification"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Notification"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Create new notification"
      tags:
      - "notification-rest-controller"
  /notifications:
    get:
      operationId: "getNotifications"
      parameters:
      - in: "query"
        name: "isRead"
        required: false
        schema:
          type: "boolean"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/Notification"
                type: "array"
          description: "OK"
      summary: "Get notifications of a user"
      tags:
      - "notification-rest-controller"
  /notifications/event-notification-model:
    get:
      operationId: "getEventNotificationModel"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventNotificationModel"
          description: "OK"
      summary: "Get event notification model"
      tags:
      - "notification-rest-controller"
  /notifications/read:
    patch:
      operationId: "setReadOfNotifications"
      parameters:
      - in: "query"
        name: "read"
        required: true
        schema:
          type: "boolean"
      requestBody:
        content:
          application/json:
            schema:
              items:
                format: "int64"
                type: "integer"
              type: "array"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Set read property of notifications"
      tags:
      - "notification-rest-controller"
  /observer/job:
    post:
      operationId: "createJobObserver"
      parameters:
      - in: "query"
        name: "userUuid"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "jobId"
        required: true
        schema:
          format: "int32"
          type: "integer"
      - in: "query"
        name: "jobTarget"
        required: true
        schema:
          $ref: "#/components/schemas/JobTarget"
      - in: "query"
        name: "jobGoal"
        required: true
        schema:
          $ref: "#/components/schemas/JobGoal"
      responses:
        "200":
          description: "OK"
      summary: "Create observer for running job"
      tags:
      - "observer-rest-controller"
security:
- bearer_auth: []
- spring_oauth: []
servers:
- url: "http://localhost:9002/notification-service"
