name: Cleanup Branch Docker Images

on:
  delete:
  workflow_dispatch:
    inputs:
      branch_ref:
        description: "Branch ref to cleanup (e.g. feature/my-branch). Optional for manual reruns."
        required: false
        type: string

jobs:
  cleanup:
    if: |
      (github.event_name == 'delete' && github.event.ref_type == 'branch' &&
      (startsWith(github.event.ref, 'feature/') || startsWith(github.event.ref, 'fix/'))) ||
      (github.event_name == 'workflow_dispatch' &&
      (startsWith(inputs.branch_ref, 'feature/') || startsWith(inputs.branch_ref, 'fix/')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          if command -v gh >/dev/null 2>&1; then
            echo "gh already installed"
            gh --version | head -n 1
            exit 0
          fi

          echo "gh not found, installing..."
          if command -v apt-get >/dev/null 2>&1; then
            if command -v sudo >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y gh
            else
              apt-get update
              apt-get install -y gh
            fi
          elif command -v apk >/dev/null 2>&1; then
            apk add --no-cache github-cli
          else
            echo "Unsupported package manager for automatic gh installation"
            exit 1
          fi

          gh --version | head -n 1

      - name: Delete branch Docker images from GHCR
        env:
          GH_TOKEN: ${{ secrets.GHCR_CLEANUP_TOKEN != '' && secrets.GHCR_CLEANUP_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          command -v gh >/dev/null 2>&1 || { echo "gh CLI is required but not installed"; exit 1; }

          successful_deletions=()
          failed_deletions=()
          attempted_deletions=0

          BRANCH_REF="${{ github.event.ref }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.branch_ref }}" ]; then
            BRANCH_REF="${{ inputs.branch_ref }}"
          fi

          BRANCH_TAG=$(echo "${BRANCH_REF}" | tr '/' '-')
          REPO="${{ github.repository }}"
          ORG="${REPO%%/*}"

          echo "Cleaning up images for branch ref: ${BRANCH_REF}"
          echo "Cleaning up images for branch tag: ${BRANCH_TAG}"

          PACKAGES_RAW=""
          if ! PACKAGES_RAW=$(gh api --paginate \
            --method GET \
            "/repos/${REPO}/packages?package_type=container&per_page=100" \
            --jq '.[].name' \
            2>/tmp/gh-packages-repo.err); then
            echo "Repo package listing failed, trying org package listing..."
            cat /tmp/gh-packages-repo.err || true
            if ! PACKAGES_RAW=$(gh api --paginate \
              --method GET \
              "/orgs/${ORG}/packages?package_type=container&per_page=100" \
              --jq '.[].name' \
              2>/tmp/gh-packages-org.err); then
              echo "Failed to list container packages for repo '${REPO}' and org '${ORG}'."
              cat /tmp/gh-packages-org.err || true
              echo "If GITHUB_TOKEN is insufficient, add secret GHCR_CLEANUP_TOKEN with read:packages + delete:packages (and SSO enabled if required)."
              exit 1
            fi
          fi

          mapfile -t PACKAGES <<< "${PACKAGES_RAW}"

          if [ "${#PACKAGES[@]}" -eq 0 ]; then
            echo "No container packages found for cleanup."
            exit 0
          fi

          for pkg in "${PACKAGES[@]}"; do
              [ -z "$pkg" ] && continue

              # Package names containing '/' must be URL-encoded (/ -> %2F)
              ENCODED_PKG=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$pkg")

              REPO_DELETE_ENDPOINT_PREFIX="/repos/${REPO}/packages/container/${ENCODED_PKG}/versions"
              ORG_DELETE_ENDPOINT_PREFIX="/orgs/${ORG}/packages/container/${ENCODED_PKG}/versions"

              VERSION_IDS_RAW=""
              DELETE_ENDPOINT_PREFIX=""

              # Some GHCR packages are repo-scoped, others org-scoped. Detect the scope per package.
              if VERSION_IDS_RAW=$(gh api --paginate \
                --method GET \
                "${REPO_DELETE_ENDPOINT_PREFIX}?per_page=100" \
                --jq ".[] | select(.metadata.container.tags // [] | index(\"${BRANCH_TAG}\") != null) | .id" \
                2>/dev/null); then
                DELETE_ENDPOINT_PREFIX="${REPO_DELETE_ENDPOINT_PREFIX}"
              elif VERSION_IDS_RAW=$(gh api --paginate \
                --method GET \
                "${ORG_DELETE_ENDPOINT_PREFIX}?per_page=100" \
                --jq ".[] | select(.metadata.container.tags // [] | index(\"${BRANCH_TAG}\") != null) | .id" \
                2>/dev/null); then
                DELETE_ENDPOINT_PREFIX="${ORG_DELETE_ENDPOINT_PREFIX}"
              else
                echo "Unable to list versions for package ${pkg}; skipping."
                continue
              fi

              mapfile -t VERSION_IDS <<< "${VERSION_IDS_RAW}"

              for VERSION_ID in "${VERSION_IDS[@]}"; do
                [ -z "$VERSION_ID" ] && continue
                attempted_deletions=$((attempted_deletions + 1))
                deletion_label="${pkg}:${BRANCH_TAG} (id=${VERSION_ID})"
                echo "Deleting ${pkg}:${BRANCH_TAG} (id=${VERSION_ID})"
                if gh api --method DELETE \
                  "${DELETE_ENDPOINT_PREFIX}/${VERSION_ID}" >/dev/null; then
                  successful_deletions+=("${deletion_label}")
                else
                  echo "Primary delete endpoint failed for ${pkg}. Trying alternate scope..."
                  alt_endpoint=""
                  if [ "${DELETE_ENDPOINT_PREFIX}" = "${REPO_DELETE_ENDPOINT_PREFIX}" ]; then
                    alt_endpoint="${ORG_DELETE_ENDPOINT_PREFIX}/${VERSION_ID}"
                  else
                    alt_endpoint="${REPO_DELETE_ENDPOINT_PREFIX}/${VERSION_ID}"
                  fi

                  if gh api --method DELETE "${alt_endpoint}" >/dev/null; then
                    successful_deletions+=("${deletion_label}")
                  else
                    echo "Delete failed in both scopes for ${deletion_label}"
                    failed_deletions+=("${deletion_label}")
                  fi
                fi
              done
            done

          echo ""
          echo "Cleanup summary for tag '${BRANCH_TAG}':"
          echo "- Attempted deletions: ${attempted_deletions}"
          echo "- Successful deletions: ${#successful_deletions[@]}"
          echo "- Failed deletions: ${#failed_deletions[@]}"

          echo "Successful deletions:"
          if [ "${#successful_deletions[@]}" -eq 0 ]; then
            echo "  (none)"
          else
            for item in "${successful_deletions[@]}"; do
              echo "  - ${item}"
            done
          fi

          echo "Failed deletions:"
          if [ "${#failed_deletions[@]}" -eq 0 ]; then
            echo "  (none)"
          else
            for item in "${failed_deletions[@]}"; do
              echo "  - ${item}"
            done
          fi
