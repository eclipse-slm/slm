name: Build and deploy docs
on:
  push:
    branches:
      - main
      - develop
  release:
    types:
      - published
env:
  VERSION_PATH: /
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Update VERSION_PATH
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: echo VERSION_PATH=/version/$(echo $GITHUB_REF | cut -d / -f 3 | cut -d v -f 2- | cut -d . -f 1,2)/ >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install and Build 🔧
        run: |
          cd docs
          yarn install
          yarn build

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: github-pages                          # The branch the action should deploy to
          folder: docs/.vitepress/dist                  # The folder the action should deploy
          target-folder: ${{ env.VERSION_PATH }}
          clean: true                                   # Automatically remove deleted files from the deploy branch
          clean-exclude: '["version"]'
