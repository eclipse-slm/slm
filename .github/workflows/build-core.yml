name: Build Core

concurrency:
  group: build-core-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
      - develop
      - release/*
      - feature/*
      - fix/*
  pull_request:
    branches:
      - main
      - develop

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      has_release_tag: ${{ steps.evaluate.outputs.has_release_tag }}
      should_snapshot_deploy: ${{ steps.evaluate.outputs.should_snapshot_deploy }}
      should_release_deploy: ${{ steps.evaluate.outputs.should_release_deploy }}
      should_verify: ${{ steps.evaluate.outputs.should_verify }}
      should_run_staging: ${{ steps.evaluate.outputs.should_run_staging }}
      should_branch_deploy: ${{ steps.evaluate.outputs.should_branch_deploy }}
      branch_tag: ${{ steps.evaluate.outputs.branch_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Determine workflow mode
        id: evaluate
        shell: bash
        run: |
          git fetch --tags --force
          STABLE_SEMVER_REGEX='^v?(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          LEGACY_RELEASE_REGEX='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-RELEASE$'

          HAS_RELEASE_TAG=false
          while IFS= read -r tag; do
            if [[ "$tag" =~ $STABLE_SEMVER_REGEX || "$tag" =~ $LEGACY_RELEASE_REGEX ]]; then
              HAS_RELEASE_TAG=true
              break
            fi
          done < <(git tag --points-at "$GITHUB_SHA")

          SHOULD_SNAPSHOT_DEPLOY=false
          SHOULD_RELEASE_DEPLOY=false
          SHOULD_VERIFY=false
          SHOULD_RUN_STAGING=false

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            SHOULD_VERIFY=true
          elif [[ "$GITHUB_REF_NAME" == "develop" ]]; then
            SHOULD_SNAPSHOT_DEPLOY=true
            SHOULD_RUN_STAGING=true
          elif [[ "$GITHUB_REF_NAME" == "main" && "$HAS_RELEASE_TAG" == "true" ]]; then
            SHOULD_RELEASE_DEPLOY=true
            SHOULD_RUN_STAGING=true
          else
            SHOULD_VERIFY=true
          fi

          SHOULD_BRANCH_DEPLOY=false
          BRANCH_TAG=""
          if [[ "$GITHUB_REF_NAME" =~ ^feature/ || "$GITHUB_REF_NAME" =~ ^fix/ ]]; then
            SHOULD_BRANCH_DEPLOY=true
            BRANCH_TAG=$(echo "$GITHUB_REF_NAME" | tr '/' '-')
          fi

          echo "has_release_tag=$HAS_RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "should_snapshot_deploy=$SHOULD_SNAPSHOT_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "should_release_deploy=$SHOULD_RELEASE_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "should_verify=$SHOULD_VERIFY" >> "$GITHUB_OUTPUT"
          echo "should_run_staging=$SHOULD_RUN_STAGING" >> "$GITHUB_OUTPUT"
          echo "should_branch_deploy=$SHOULD_BRANCH_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      MAVEN_CLI_OPTS: "-s ci/ci_maven_settings.xml --batch-mode --errors --fail-at-end --show-version --no-transfer-progress -T 1C -DinstallAtEnd=true -DdeployAtEnd=true"
      COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        build: [
          {
            type: "frontend",
            maven-projects: "ui"
          },
          {
            type: "backend",
            maven-projects: "!ui"
          }
        ]
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE
      - uses: s4u/maven-settings-action@v4.0.0
        if: needs.prepare.outputs.should_snapshot_deploy == 'true' || needs.prepare.outputs.should_release_deploy == 'true'
        with:
          path: ci/ci_maven_settings.xml
          githubServer: false
          servers: '[
            {
              "id": "ghcr.io",
              "username": "${{github.actor}}",
              "password": "${{secrets.GITHUB_TOKEN}}"
            },
            {
              "id": "central",
              "username": "${{secrets.CENTRAL_SONATYPE_TOKEN_USERNAME}}",
              "password": "${{secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD}}"
            },
            {
              "id": "central-snapshots",
              "username": "${{secrets.CENTRAL_SONATYPE_TOKEN_USERNAME}}",
              "password": "${{secrets.CENTRAL_SONATYPE_TOKEN_PASSWORD}}"
            }
          ]'
      - name: Build '${{ matrix.build.type }}' snapshots with Maven and push Docker Images
        if: needs.prepare.outputs.should_snapshot_deploy == 'true'
        run: mvn -Psnapshot $MAVEN_CLI_OPTS "-Dmaven.central.deployment.name=build-core-${{ github.run_id }}-${{ github.run_attempt }}" --projects '${{ matrix.build.maven-projects }}' deploy

      - name: Build '${{ matrix.build.type }}' release artifacts with Maven and push Docker Images
        if: needs.prepare.outputs.should_release_deploy == 'true'
        run: mvn -Prelease $MAVEN_CLI_OPTS "-Dmaven.central.deployment.name=build-core-${{ github.run_id }}-${{ github.run_attempt }}" --projects '${{ matrix.build.maven-projects }}' deploy
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Build '${{ matrix.build.type }}' with Maven
        if: needs.prepare.outputs.should_verify == 'true'
        run: mvn -Psnapshot $MAVEN_CLI_OPTS --projects '${{ matrix.build.maven-projects }}' verify
      - name: Log in to GitHub Container Registry (branch deploy)
        if: needs.prepare.outputs.should_branch_deploy == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag and push Docker images with branch tag
        if: needs.prepare.outputs.should_branch_deploy == 'true'
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          BRANCH_TAG="${{ needs.prepare.outputs.branch_tag }}"

          echo "Retagging images from :${VERSION} to :${BRANCH_TAG}"

          docker images --format "{{.Repository}}:{{.Tag}}" \
            | grep "^ghcr.io/eclipse-slm/.*:${VERSION}$" \
            | while IFS= read -r image; do
                REPO="${image%:*}"
                docker tag "$image" "${REPO}:${BRANCH_TAG}"
                docker push "${REPO}:${BRANCH_TAG}"
                echo "Pushed ${REPO}:${BRANCH_TAG}"
              done
      - name: Build Coveralls Report
        if: ${{ env.COVERALLS_REPO_TOKEN != '' && matrix.build.type == 'backend' && needs.prepare.outputs.should_verify == 'true' && (github.event_name == 'pull_request' || startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/')) }}
        run: mvn -Psnapshot --batch-mode --errors --no-transfer-progress jacoco-aggregator:report-aggregate-all coveralls:report -DrepoToken=$COVERALLS_REPO_TOKEN
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
      - name: Log test output on failure
        if: failure() || cancelled()
        run: find . -type f -path "*test-reports/*-output.txt" -exec tail -n +1 {} +

  deploy-staging-environment:
    needs: [prepare, build]
    if: needs.prepare.outputs.should_run_staging == 'true'
    runs-on: self-hosted
    env:
      STAGING_VM_IP: ${{ github.ref_name == 'develop' && '10.17.165.36' || '10.17.166.74' }}
      STAGING_VM_HOSTNAME: ${{ github.ref_name == 'develop' && 'develop.staging.slm.local' || 'main.staging.slm.local' }}
    steps:
      - name: Deploy stack von staging VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{env.STAGING_VM_IP}}
          username: operation
          key: ${{secrets.RUNNER_PRIVATE_KEY}}
          command_timeout: 45m
          envs: STAGING_VM_HOSTNAME,STAGING_VM_IP
          script: |
            rm -r ~/staging/tmp || true && mkdir -p ~/staging/tmp && cd ~/staging/tmp
            git clone -b ${{github.ref_name}} https://github.com/${{github.repository}}.git
            cd ~/staging/tmp/slm
            CORE_VERSION=$(cat pom.xml | grep -oPm1 "(?<=<revision>)[^<]+")
            INSTALL_DIRECTORY=/opt/eclipse-slm
            
            echo ${{secrets.GITHUB_TOKEN}} | docker login -u${{github.actor}} --password-stdin ghcr.io
            
            docker pull ghcr.io/eclipse-slm/slm/installer-api:$CORE_VERSION
            docker run \
              --rm \
              --pull=always \
              --env SLM_VERSION=$CORE_VERSION \
              --env SLM_HOSTNAME=$STAGING_VM_HOSTNAME \
              --env SLM_IP=$STAGING_VM_IP \
              --env INSTALL_DIRECTORY=$INSTALL_DIRECTORY \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume $INSTALL_DIRECTORY:/install \
              ghcr.io/eclipse-slm/slm/installer-api:$CORE_VERSION \
              uninstall
            docker system prune -f

            docker stop eclipse-slm-installer || true
            docker run \
              --rm \
              --name eclipse-slm-installer \
              --pull=always \
              --env SLM_VERSION=$CORE_VERSION \
              --env SLM_HOSTNAME=$STAGING_VM_HOSTNAME \
              --env SLM_IP=$STAGING_VM_IP \
              --env INSTALL_DIRECTORY=$INSTALL_DIRECTORY \
              --volume /var/run/docker.sock:/var/run/docker.sock \
              --volume $INSTALL_DIRECTORY:/install \
              --add-host $STAGING_VM_HOSTNAME:host-gateway \
              ghcr.io/eclipse-slm/slm/installer-api:$CORE_VERSION \
              install

      - name: Test stack running on staging VM
        uses: appleboy/ssh-action@v1
        with:
          host: ${{env.STAGING_VM_IP}}
          username: operation
          key: ${{secrets.RUNNER_PRIVATE_KEY}}
          script: |
            cd ~/staging/tmp/slm/tests/backend
            mvn test -Dtest=DockerStackTests

  test-external-components:
    needs: [prepare, deploy-staging-environment]
    if: needs.prepare.outputs.should_run_staging == 'true'
    runs-on: self-hosted
    container:
      image: maven:3.9-eclipse-temurin-21-noble
      volumes:
        - /tmp/.m2:/root/.m2
      options: "--add-host=${{ github.ref_name == 'develop' && 'develop.staging.slm.local' || 'main.staging.slm.local' }}:${{ github.ref_name == 'develop' && '10.17.165.36' || '10.17.166.74' }}"
    strategy:
      matrix:
        tests: [
          {
            component: "AWX",
            test-class: "AWXTests"
          },
          {
            component: "Consul",
            test-class: "ConsulTests"
          },
          {
            component: "Keycloak",
            test-class: "KeycloakTests"
          },
          {
            component: "Vault",
            test-class: "VaultTests"
          }
        ]
    env:
      TARGET_HOST: ${{ github.ref_name == 'develop' && '10.17.165.36' || '10.17.166.74' }}
    steps:
      - uses: actions/checkout@v6
      - name: Run tests for '${{ matrix.tests.component }}' with Maven
        run: |
          cd tests/backend
          mvn test -Dtest=${{ matrix.tests.test-class }}

  test-internal-components:
    needs: [prepare, test-external-components]
    if: needs.prepare.outputs.should_run_staging == 'true'
    runs-on: self-hosted
    container:
      image: maven:3.9-eclipse-temurin-21-noble
      volumes:
        - /tmp/.m2:/root/.m2
    strategy:
      matrix:
        tests: [
          {
            component: "Notification Service",
            test-class: "NotificationServiceTests"
          },
          {
            component: "Resource Management",
            test-class: "ResourceManagementTests"
          },
          {
            component: "Service Management",
            test-class: "ServiceManagementTests"
          }
        ]
    env:
      TARGET_HOST: ${{ github.ref_name == 'develop' && '10.17.165.36' || '10.17.166.74' }}
    steps:
      - uses: actions/checkout@v6
      - name: Run tests for '${{ matrix.tests.component }}' with Maven
        run: |
          cd tests/backend
          mvn test -Dtest=${{ matrix.tests.test-class }}
