---
components:
  schemas:
    Credential:
      properties:
        data:
          oneOf:
          - $ref: "#/components/schemas/CredentialDataKeyPair"
          - $ref: "#/components/schemas/CredentialDataUsernamePassword"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        scopesRaw:
          items:
            type: "string"
          type: "array"
      type: "object"
    CredentialCreateRequest:
      properties:
        credential:
          $ref: "#/components/schemas/Credential"
        entityLinks:
          items:
            $ref: "#/components/schemas/CredentialEntityLinkCreateDTO"
          type: "array"
        fullPathOwnerGroupId:
          type: "string"
      type: "object"
    CredentialData:
      discriminator:
        propertyName: "credentialDataType"
      properties:
        credentialDataType:
          $ref: "#/components/schemas/CredentialDataType"
      type: "object"
    CredentialDataKeyPair:
      allOf:
      - $ref: "#/components/schemas/CredentialData"
      - properties:
          privateKey:
            type: "string"
          publicKey:
            type: "string"
        type: "object"
      type: "object"
    CredentialDataKeyPairReadDTO:
      allOf:
      - $ref: "#/components/schemas/CredentialDataReadDTO"
      - properties:
          publicKey:
            type: "string"
        type: "object"
      type: "object"
    CredentialDataReadDTO:
      discriminator:
        propertyName: "credentialDataType"
      properties:
        credentialDataType:
          $ref: "#/components/schemas/CredentialDataType"
      type: "object"
    CredentialDataType:
      enum:
      - "USERNAME_PASSWORD"
      - "KEY_PAIR"
      type: "string"
    CredentialDataUsernamePassword:
      allOf:
      - $ref: "#/components/schemas/CredentialData"
      - properties:
          password:
            type: "string"
          username:
            type: "string"
        type: "object"
      type: "object"
    CredentialDataUsernamePasswordReadDTO:
      allOf:
      - $ref: "#/components/schemas/CredentialDataReadDTO"
      - properties:
          username:
            type: "string"
        type: "object"
      type: "object"
    CredentialEntityLinkCreateDTO:
      properties:
        entityId:
          type: "string"
        entityType:
          type: "string"
      type: "object"
    CredentialEntityLinkReadDTO:
      properties:
        entityId:
          type: "string"
        entityType:
          type: "string"
      type: "object"
    CredentialReadDTO:
      properties:
        data:
          oneOf:
          - $ref: "#/components/schemas/CredentialDataKeyPairReadDTO"
          - $ref: "#/components/schemas/CredentialDataUsernamePasswordReadDTO"
        entityLinks:
          items:
            $ref: "#/components/schemas/CredentialEntityLinkReadDTO"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        scopesRaw:
          items:
            type: "string"
          type: "array"
      type: "object"
    UserCreateRequest:
      properties:
        admin:
          type: "boolean"
        email:
          type: "string"
        firstName:
          pattern: "^[A-Za-z][A-Za-z .-]*$"
          type: "string"
        isAdmin:
          type: "boolean"
          writeOnly: true
        isPasswordTemporary:
          type: "boolean"
          writeOnly: true
        lastName:
          pattern: "^[A-Za-z][A-Za-z.-]*$"
          type: "string"
        password:
          type: "string"
        passwordTemporary:
          type: "boolean"
        username:
          pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
          type: "string"
      required:
      - "email"
      - "firstName"
      - "lastName"
      - "username"
      type: "object"
  securitySchemes:
    bearer_auth:
      bearerFormat: "JWT"
      scheme: "bearer"
      type: "http"
    spring_oauth:
      description: "Oauth2 flow"
      flows:
        authorizationCode:
          authorizationUrl: ""
          refreshUrl: ""
          scopes: {}
          tokenUrl: ""
      type: "oauth2"
info:
  contact:
    email: "matthias.schneider@ipa.fraunhofer.de"
    name: "Fraunhofer IPA"
    url: "https://www.ipa.fraunhofer.de"
  description: "REST API of Platform Management"
  title: "Platform Management"
  version: "1.5.0-SNAPSHOT"
openapi: "3.0.1"
paths:
  /credentials:
    get:
      operationId: "getCredentialsOfUser"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/CredentialReadDTO"
                type: "array"
          description: "OK"
      summary: "Get credentials of user"
      tags:
      - "Credential Management"
  /credentials/:
    post:
      operationId: "createCredential"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Create credential"
      tags:
      - "Credential Management"
  /credentials/entities/{entityId}:
    get:
      operationId: "getCredentialsOfEntity"
      parameters:
      - in: "path"
        name: "entityId"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "entityType"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/CredentialReadDTO"
                type: "array"
          description: "OK"
      summary: "Get credentials of entity"
      tags:
      - "Credential Management"
  /credentials/{credentialId}:
    delete:
      operationId: "deleteCredential"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          description: "OK"
      summary: "Delete credential by id"
      tags:
      - "Credential Management"
    get:
      operationId: "getCredentialById"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CredentialReadDTO"
          description: "OK"
      summary: "Get credential by id"
      tags:
      - "Credential Management"
    put:
      operationId: "createOrUpdateCredential"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Create or update credential"
      tags:
      - "Credential Management"
  /credentials/{credentialId}/data:
    get:
      operationId: "getCredentialDataById"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "impersonatedGroupId"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                oneOf:
                - $ref: "#/components/schemas/CredentialDataKeyPair"
                - $ref: "#/components/schemas/CredentialDataUsernamePassword"
          description: "OK"
      summary: "Get credential data by id"
      tags:
      - "Credential Management"
  /credentials/{credentialId}/links:
    delete:
      operationId: "deleteCredentialEntityLink"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      - in: "query"
        name: "entityType"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "entityId"
        required: true
        schema:
          type: "string"
      - in: "query"
        name: "deleteIfOrphaned"
        required: false
        schema:
          default: false
          type: "boolean"
      responses:
        "200":
          description: "OK"
      summary: "Delete credential entity link"
      tags:
      - "Credential Management"
    post:
      operationId: "linkCredentialToEntity"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialEntityLinkCreateDTO"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Link existing credential to entity"
      tags:
      - "Credential Management"
  /credentials/{credentialId}/scopes:
    delete:
      operationId: "removeCredentialScopes"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: "string"
              type: "array"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Remove scopes from credential"
      tags:
      - "Credential Management"
    post:
      operationId: "addCredentialScopes"
      parameters:
      - in: "path"
        name: "credentialId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              items:
                type: "string"
              type: "array"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Add scopes to credential"
      tags:
      - "Credential Management"
  /users:
    get:
      operationId: "getUsers"
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  additionalProperties:
                    type: "object"
                  type: "object"
                type: "array"
          description: "OK"
      summary: "Get users"
      tags:
      - "User Management"
    post:
      operationId: "createUser"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
        required: true
      responses:
        "200":
          description: "OK"
      summary: "Add user"
      tags:
      - "User Management"
  /users/{username}:
    delete:
      operationId: "deleteUser"
      parameters:
      - in: "path"
        name: "username"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
      summary: "Delete user by username"
      tags:
      - "User Management"
  /users/{username}/admin:
    post:
      operationId: "makeUserAdmin"
      parameters:
      - in: "path"
        name: "username"
        required: true
        schema:
          type: "string"
      responses:
        "200":
          description: "OK"
      summary: "Grant admin role to user by username"
      tags:
      - "User Management"
security:
- bearer_auth: []
- spring_oauth: []
servers:
- url: "http://localhost:9001/platform-management"
