- debug:
    var: _app_config

- name: Set application-dev.yml path
  ansible.builtin.set_fact:
    _application_dev_yml_file: "{{ _application_yml_file | dirname }}/application-{{ spring_profile }}.yml"

- name: Stat application.yml file
  ansible.builtin.stat:
    path: "{{ _application_yml_file }}"
  register: application_yml_file_stat

- name: "Update'{{ _application_dev_yml_file }}'"
  when: application_yml_file_stat.stat.exists
  block:
    - name: "Copy '{{ _application_yml_file }}' to '{{ _application_dev_yml_file }}'"
      ansible.builtin.copy:
        src: "{{ _application_yml_file }}"
        dest: "{{ _application_dev_yml_file }}"
        mode: "0666"
      ignore_errors: true

    - name: "Update Consul config in file '{{ _application_dev_yml_file }}'"
      ansible.builtin.lineinfile:
        path: "{{ _application_dev_yml_file }}"
        insertafter: "consul:"
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - regexp: "acl-token: .*"
          line: "  acl-token: {{ _app_config['consul']['acl-token'] }}"
        - regexp: "scheme: .*"
          line: "  scheme: {{ consul_scheme }}"
        - regexp: "host: .*"
          line: "  host: {{ consul_host }}"
        - regexp: "port: .*"
          line: "  port: {{ consul_port }}"

    - name: "Update consul service name in file '{{ _application_dev_yml_file }}'"
      when: (_consul_service_name is defined) and (_consul_service_name | length > 0)
      ansible.builtin.lineinfile:
        path: "{{ _application_dev_yml_file }}"
        insertafter: 'consul:'
        regexp: "name: {{ _consul_service_name }}.*"
        line: '    name: {{ _consul_service_name }}-external'

    - name: "Check if deployment section exists in '{{ _application_dev_yml_file }}'"
      ansible.builtin.lineinfile:
        path: "{{ _application_dev_yml_file }}"
        regexp: "### Deployment"
        state: absent
      check_mode: true
      changed_when: false
      register: deployment_section

    - name: "Update deployment section in file '{{ _application_dev_yml_file }}'"
      ansible.builtin.lineinfile:
        path: "{{ _application_dev_yml_file }}"
        insertafter: "### Deployment"
        firstmatch: true
        regexp: " hostname:"
        line: "  hostname: {{ LOCAL_HOSTNAME }}"
      when: deployment_section.found

    - name: "Set spring.config.import in file '{{ _application_dev_yml_file }}'"
      ansible.builtin.replace:
        path: "{{ _application_dev_yml_file }}"
        regexp: '^([ \t]*)#?[ \t]*config:[ \t]*\n[ \t]*#?[ \t]*import:.*$'
        replace: '\1config:\n\1  import: "consul:"'

    - name: "Check if spring.config.import exists in '{{ _application_dev_yml_file }}'"
      ansible.builtin.lineinfile:
        path: "{{ _application_dev_yml_file }}"
        regexp: '^[ \t]*import: "consul:"[ \t]*$'
        state: absent
      check_mode: true
      changed_when: false
      register: spring_config_import

    - name: "Add spring.config.import in file '{{ _application_dev_yml_file }}'"
      ansible.builtin.replace:
        path: "{{ _application_dev_yml_file }}"
        regexp: '^spring:[ \t]*$'
        replace: 'spring:\n  config:\n    import: "consul:"'
      when: not spring_config_import.found
