### Inputs
- name: "Assert inputs of 'keycloak/client | create_group.yml'"
  assert:
    that:
      - (keycloak.url.external is defined) and (keycloak.url.external|length > 0)         # Auth URL of the Keycloak instance
      - (_keycloak_access_token is defined) and (_keycloak_access_token|length > 0)       # Access token to authenticate with Keycloak
      - (_keycloak_realm_name is defined) and (_keycloak_realm_name|length > 0)           # Name of the Keycloak realm where the realm role should be created
      - (_keycloak_parent_group_id is defined) and (_keycloak_parent_group_id|length > 0) # ID of the parent group under which the child group should be created
      - (_keycloak_group is defined) and (_keycloak_group|length > 0)                     # Keycloak group representation to create

- name: "Create group '{{ _keycloak_group.name }}'"
  uri:
    url: "{{ keycloak.url.external }}/admin/realms/{{ _keycloak_realm_name }}/groups/{{ _keycloak_parent_group_id }}/children"
    validate_certs: no
    method: POST
    headers:
      authorization: "Bearer {{ _keycloak_access_token }}"
    body_format: json
    body: "{{ _keycloak_group }}"
    status_code: 201, 409
  register: output_post_group
  changed_when: output_post_group.status == 201
