- name: "Assert inputs of 'vault/client | create_approle.yml'"
  assert:
    that:
      - (vault.url.internal is defined) and (vault.url.internal|length > 0)           # URL of Vault
      - (_vault_token is defined) and (_vault_token|length > 0)     # Token to authenticate with Vault
      - (_host is defined) and (_host|length > 0)
      - (_role_name is defined) and (_role_name|length > 0)
      - (_allowed_domains is defined) and (_allowed_domains|length > 0)

- name: "Get the pki_int config issuers."
  uri:
    url: "{{ vault.url.internal }}/v1/pki_int_{{ _host }}/config/issuers"
    validate_certs: no
    method: GET
    headers:
      Authorization: "Bearer {{ _vault_token }}"
    status_code: 200, 204
  register: pki_int_issuers


- name: "Create a role named {{ _role_name }} which allows subdomains."
  uri:
    url: "{{ vault.url.internal }}/v1/pki_int_{{ _host }}/roles/{{ _role_name }}"
    validate_certs: no
    method: POST
    headers:
      Authorization: "Bearer {{ _vault_token }}"
    status_code: 200, 204
    body_format: json
    body:
      allowed_domains: " {{ _allowed_domains }}"
      allow_subdomains: "true"
      issuer_ref: "{{pki_int_issuers.json.data.default}}"
      max_ttl: "720h"