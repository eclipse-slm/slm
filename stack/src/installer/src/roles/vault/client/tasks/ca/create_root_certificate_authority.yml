- name: "Assert inputs of 'vault/client | ca/create_root_certificate_authority.yml'"
  assert:
    that:
      - (vault.url.internal is defined) and (vault.url.internal|length > 0)
      - (_vault_token is defined) and (_vault_token|length > 0)
      - (_pki_name is defined) and (_pki_name|length > 0)
      - (_common_name is defined) and (_common_name|length > 0)
      - (_ttl is defined) and (_ttl|length > 0)
      - (_issuer_name is defined) and (_issuer_name|length > 0)
      - (_role_name is defined) and (_role_name|length > 0)
      # Optional
      # - _country
      # - _organization
      # - _alt_names

    fail_msg: "Variable must be defined and not empty"

- set_fact:
    pki_name_full: "pki_root_{{ _pki_name }}"

- name: "Vault | PKI Root CA | Check if pki secrets engine 'pki_root_{{ pki_name_full }}' exists"
  uri:
    url: "{{ vault.url.internal }}/v1/sys/mounts/{{ pki_name_full }}"
    validate_certs: no
    method: GET
    headers:
      Authorization: "Bearer {{ _vault_token }}"
    status_code: 200, 400
    body_format: json
    body:
      type: "pki"
  register: pki

- block:
    - name: "Vault | PKI Root CA | Enable the pki secrets engine at pki path using /sys/mounts"
      uri:
        url: "{{ vault.url.internal }}/v1/sys/mounts/{{ pki_name_full }}"
        validate_certs: no
        method: POST
        headers:
          Authorization: "Bearer {{ _vault_token }}"
        status_code: 200, 204
        body_format: json
        body:
          type: "pki"

    - name: "Vault | PKI Root CA | Tune the pki secrets engine to issue certificates with a maximum time-to-live (TTL) of {{ _ttl }}"
      uri:
        url: "{{ vault.url.internal }}/v1/sys/mounts/{{ pki_name_full }}/tune"
        validate_certs: no
        method: POST
        headers:
          Authorization: "Bearer {{ _vault_token }}"
        status_code: 200, 204
        body_format: json
        body:
          max_lease_ttl: "{{ _ttl }}"

    - name: "Vault | PKI Root CA | Generate the root certificate and extract the CA certificate"
      uri:
        url: "{{ vault.url.internal }}/v1/{{ pki_name_full }}/root/generate/internal"
        validate_certs: no
        method: POST
        headers:
          Authorization: "Bearer {{ _vault_token }}"
        status_code: 200, 204
        body_format: json
        body:
          common_name: "{{ _common_name }}"
          alt_names: "{{ _alt_names | default('') }}"
          issuer_name: "{{ _issuer_name | default('') }}"
          organization: "{{ _organization | default('') }}"
          country: "{{ _country | default('') }}"
          ttl: "{{ _ttl}}"
      register: root_ca

    - name: "Vault | PKI Root CA | Assert root_ca"
      assert:
        that:
          - (root_ca is defined) and (root_ca|length > 0) and (root_ca.json.data.certificate is defined) and (root_ca.json.data.certificate |length > 0)
        fail_msg: "Root CA must be created"

    - name: "Vault | PKI Root CA | Create a role for the root CA"
      uri:
        url: "{{ vault.url.internal }}/v1/{{ pki_name_full }}/roles/{{ _role_name }}"
        validate_certs: no
        method: PUT
        headers:
          Authorization: "Bearer {{ _vault_token }}"
        status_code: 200, 204
        body_format: json
        body:
          allow_any_name: "true"
          issuer_ref: "{{ _issuer_name }}"

    - name: "Vault | PKI Root CA | Configure the CA and CRL URLs."
      uri:
        url: "{{ vault.url.internal }}/v1/{{ pki_name_full }}/config/urls"
        validate_certs: no
        method: POST
        headers:
          Authorization: "Bearer {{ _vault_token }}"
        status_code: 200, 204
        body_format: json
        body:
          issuing_certificates: "{{ vault.url.external }}/v1/pki/ca, http://127.0.0.1:8200/v1/pki/ca, http://vault:8200/v1/pki/ca"
          crl_distribution_points: "{{ vault.url.external }}/v1/pki/crl, http://127.0.0.1:8200/v1/pki/crl, http://vault:8200/v1/pki/crl"
  when: pki.status != 200