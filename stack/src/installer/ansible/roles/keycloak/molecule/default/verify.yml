---
# Purpose: assert that the instance really ended up in the expected state.
# Molecule calls this playbook with `molecule verify`.
- name: Verify
  hosts: slm
  gather_facts: false
  become: true
  pre_tasks:
    - name: Include env role from eclipse.slm collection
      ansible.builtin.include_role:
        name: eclipse.slm.env

    - name: "Load Keycloak docker compose template"
      ansible.builtin.include_vars:
        file: "../../templates/keycloak.yml"
        name: keycloak_compose

  tasks:
    - name: "Extract service names from docker compose"
      ansible.builtin.set_fact:
        service_names: "{{ keycloak_compose.services | list }}"

    - name: "Get Keycloak external ports from docker compose"
      ansible.builtin.set_fact:
        exposed_ports: "{{ keycloak_compose.services.keycloak.ports | default([]) | map('regex_replace', '^([^:]+):(.+)$', '\\1') | list }}"

    - name: "Check all Keycloak services are running and healthy"
      block:
        - name: "Get container information for {{ item }}"
          community.docker.docker_container_info:
            name: "{{ ENV.COMPOSE_PROJECT_NAME }}-{{ item }}-1"
          register: container_info
          loop: "{{ service_names }}"
          loop_control:
            label: "{{ item }}"
          changed_when: false
          failed_when: false

        - name: "Assert service {{ item.item }} is running"
          ansible.builtin.assert:
            that:
              - item.container is defined
              - item.container.State.Status == "running"
            fail_msg: "Container {{ item.item }} is not running. Status: {{ item.container.State.Status | default('not found') }}"
            success_msg: "Container {{ item.item }} is running."
          loop: "{{ container_info.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: item.failed is not defined or item.failed == false

        - name: "Assert service {{ item.item }} health check (if defined)"
          ansible.builtin.assert:
            that:
              - item.container.State.Health.Status == "healthy"
            fail_msg: "Container {{ item.item }} health check failed. Status: {{ item.container.State.Health.Status | default('no health check') }}"
            success_msg: "Container {{ item.item }} health check passed."
          loop: "{{ container_info.results }}"
          loop_control:
            label: "{{ item.item }}"
          when: 
            - item.failed is not defined or item.failed == false
            - item.container.State.Health is defined
            - item.container.State.Health.Status is defined
          ignore_errors: true

    - name: "Check all exposed ports are available"
      ansible.builtin.wait_for:
        port: "{{ item }}"
        state: started
        timeout: 5
      loop: "{{ exposed_ports }}"
      loop_control:
        label: "Port {{ item }}"
