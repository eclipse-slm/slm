consul_config:
  scheme: http
  host: localhost
  port: 8500
  tokens:

consul_local_config:
    {
      "datacenter": "fabos",
      "domain": ".consul",
      "bind_addr": "0.0.0.0",
      "retry_join": [ "0.0.0.0" ],
      "retry_interval": "30s",
      "retry_max": 0,
      "encrypt": "PDfibAdpofFo2mpIvwwQEtuo5+Z7RmMR9CLGvBWSjK0=",
      "verify_incoming": false,
      "verify_outgoing": false,
      "verify_server_hostname": false,
      "ui_config": {
        "enabled": true
      },
      "acl": {
        "enabled": true,
        "default_policy": "deny",
        "down_policy": "extend-cache",
        "enable_token_persistence": true,
        "enable_token_replication": true,
        "tokens": {
          "master": "dummy_token"
        }
      }
    }

consul_keyloak_auth_method:
  Name: keycloak
  Type: jwt
  Description: FabOS Keycloak Instance
  Config:
    OIDCDiscoveryURL: "{{ keycloak.url.external_without_port }}/realms/{{ ENV.KEYCLOAK.REALM }}"
    ClaimMappings:
      given_name: first_name
      family_name: last_name
      client_id: client_id
    ListClaimMappings:
      groups: groups
      "/realm_access/roles": resources
      aud: aud
  MaxTokenTTL: "1m"