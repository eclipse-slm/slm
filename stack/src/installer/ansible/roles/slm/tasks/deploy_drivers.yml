- name: "Normalize optional driver compose definition"
  ansible.builtin.set_fact:
    optional_driver_compose_definition: >-
      {{
        (
          ENV.RESOURCE_MANAGEMENT.DRIVERS.COMPOSE_DEFINITION
          if (ENV.RESOURCE_MANAGEMENT.DRIVERS.COMPOSE_DEFINITION is mapping)
          else ((ENV.RESOURCE_MANAGEMENT.DRIVERS.COMPOSE_DEFINITION | default('{}')) | from_yaml)
        ) | default({}, true)
      }}

- name: "Ensure optional driver compose uses SLM default network"
  ansible.builtin.set_fact:
    optional_driver_compose_definition: >-
      {{
        optional_driver_compose_definition
        | combine(
            {
              'networks': (
                optional_driver_compose_definition.networks | default({})
              ) | combine(
                {
                  'eclipse-slm_default': {
                    'external': true,
                    'name': 'eclipse-slm_default'
                  }
                },
                recursive=true
              )
            },
            recursive=true
          )
      }}

- name: "Validate optional driver compose definition"
  ansible.builtin.assert:
    that:
      - optional_driver_compose_definition is mapping
      - optional_driver_compose_definition.services is defined
      - optional_driver_compose_definition.services | length > 0
    fail_msg: "RESOURCE_MANAGEMENT.DRIVERS.COMPOSE_DEFINITION must be a compose mapping with at least one service when RESOURCE_MANAGEMENT.DRIVERS.ENABLED is true."

- name: "Start optional driver containers"
  # delegate_to: '{{ ENV.DEPLOYMENT_HOST_HOSTNAME }}'
  community.docker.docker_compose_v2:
    project_name: "{{ ENV.COMPOSE_PROJECT_NAME }}"
    definition: "{{ optional_driver_compose_definition }}"
    state: present
    pull: "{{ ENV.PULL_DOCKER_IMAGES }}"

- name: "Store resulting compose file for optional driver containers"
  ansible.builtin.copy:
    content: "{{ optional_driver_compose_definition | to_nice_yaml(indent=2) }}"
    dest: "{{ _store_compose_dir | regex_replace('/+$', '') }}/slm.drivers.yml"
  when: (_store_compose_dir is defined) and (_store_compose_dir|length > 0)

