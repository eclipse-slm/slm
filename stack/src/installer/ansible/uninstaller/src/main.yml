- name: "Uninstall SLM"
  hosts: localhost
  gather_facts: yes
  become: true
  vars:
    ansible_python_interpreter: /usr/bin/python3
    compose_project_name: eclipse-slm
  pre_tasks:
    - set_fact:
        ENV:
        SLM_HOSTNAME: "{{ lookup('ansible.builtin.env', 'SLM_HOSTNAME') }}"
        SLM_IP: "{{ lookup('ansible.builtin.env', 'SLM_IP') }}"
        INSTALL_DIRECTORY: "{{ lookup('ansible.builtin.env', 'INSTALL_DIRECTORY') }}"
    - name: "Import config from env.yml"
      include_vars:
        file: "/env/env.yml"
      loop:
        - "/env/env.yml"
      register: include_vars_env
    - name: "Check if env.custom.yml exists"
      ansible.builtin.stat:
        path: "/env/env.custom.yml"
      register: env_custom_file
    - name: "Import config from env.custom.yml"
      include_vars:
        file: "/env/env.custom.yml"
      when: env_custom_file.stat.exists
      register: include_vars_env_custom
    - name: "Import config from env.yml"
      include_vars:
        file: "{{ item }}"
      loop:
        - "/env/env.override.yml"
      register: include_vars_env_override
    - set_fact:
        ENV: "{{ ENV | combine(include_vars_env.results[0].ansible_facts, recursive=true) }}"
    - set_fact:
        ENV: "{{ ENV | combine(include_vars_env_custom.ansible_facts, recursive=true) }}"
      when: env_custom_file.stat.exists
    - set_fact:
        ENV: "{{ ENV | combine(include_vars_env_override.results[0].ansible_facts, recursive=true) }}"
    - set_fact:
        ENV: "{{ ENV | combine({
                    'SLM_HOSTNAME': lookup('ansible.builtin.env', 'SLM_HOSTNAME')
                }, recursive=True) }}"
  tasks:
    - name: Get running containers, volumes and networks
      community.docker.docker_host_info:
        containers: yes
        containers_filters:
          label: "com.docker.compose.project={{ compose_project_name }}"
        containers_all: yes
        volumes: yes
        volumes_filters:
          label: "com.docker.compose.project={{ compose_project_name }}"
        networks: yes
      register: docker_info

    - name: Remove containers
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
        keep_volumes: no
      loop: "{{ docker_info.containers | map(attribute='Id') | list }}"
      async: 60
      poll: 0
      register: async_loop

    - name: Wait until containers have been removed
      async_status:
        jid: "{{ item.ansible_job_id }}"
        mode: status
      retries: 120
      delay: 1
      loop: "{{ async_loop.results }}"
      register: async_loop_jobs
      until: async_loop_jobs.finished

    - name: Remove volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: absent
      loop: "{{ docker_info.volumes | map(attribute='Name') | list }}"

    - name: Remove network
      community.docker.docker_network:
        name: "{{ compose_project_name }}_default"
        state: absent

    - name: Remove directories of SLM installation
      ansible.builtin.file:
        path: "/install/{{ item }}"
        state: absent
      with_items:
        - deployment
        - config

    - debug:
        msg: "Eclipse Service Lifecycle Management version '{{ ENV.SLM_VERSION }}' successfully uninstalled"