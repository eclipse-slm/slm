- name: "Normalize compose definition for additional service '{{ additional_service_definition.key }}'"
  set_fact:
    additional_service_compose_definition: >-
      {{
        (
          additional_service_definition.value.COMPOSE_DEFINITION
          if (additional_service_definition.value.COMPOSE_DEFINITION is mapping)
          else ((additional_service_definition.value.COMPOSE_DEFINITION | default('{}')) | from_yaml)
        ) | default({}, true)
      }}

- name: "Validate compose definition for additional service '{{ additional_service_definition.key }}'"
  assert:
    that:
      - additional_service_compose_definition is mapping
      - additional_service_compose_definition.services is defined
      - additional_service_compose_definition.services | length > 0
    fail_msg: "ADDITIONAL_SERVICES.{{ additional_service_definition.key }}.COMPOSE_DEFINITION must be a compose mapping with at least one service."

- name: "Start additional service stack '{{ additional_service_definition.key }}'"
  # delegate_to: '{{ ENV.DEPLOYMENT_HOST_HOSTNAME }}'
  community.docker.docker_compose_v2:
    project_name: "{{ additional_service_definition.value.PROJECT_NAME | default(ENV.COMPOSE_PROJECT_NAME) }}"
    definition: "{{ additional_service_compose_definition }}"
    state: present
    pull: "{{ ENV.PULL_DOCKER_IMAGES }}"

- name: "Store resulting compose file for additional service '{{ additional_service_definition.key }}'"
  copy:
    content: "{{ additional_service_compose_definition | to_nice_yaml(indent=2) }}"
    dest: "{{ _store_compose_dir | regex_replace('/+$', '') }}/additional_{{ additional_service_definition.key | regex_replace('[^A-Za-z0-9_.-]', '_') }}.yml"
  when: (_store_compose_dir is defined) and (_store_compose_dir|length > 0)

