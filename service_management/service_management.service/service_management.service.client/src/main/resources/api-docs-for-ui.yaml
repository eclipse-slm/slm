---
components:
  schemas:
    AdministrativeInformation:
      properties:
        creator:
          $ref: "#/components/schemas/Reference"
        embeddedDataSpecifications:
          items:
            $ref: "#/components/schemas/EmbeddedDataSpecification"
          type: "array"
        revision:
          type: "string"
        templateId:
          type: "string"
        version:
          type: "string"
      type: "object"
    AvailableServiceInstanceVersionChange:
      properties:
        changeType:
          $ref: "#/components/schemas/AvailableServiceInstanceVersionChangeType"
        serviceOfferingVersionId:
          format: "uuid"
          type: "string"
        version:
          type: "string"
        versionDate:
          format: "date-time"
          type: "string"
      type: "object"
    AvailableServiceInstanceVersionChangeType:
      enum:
      - "UP"
      - "DOWN"
      type: "string"
    Base64UrlEncodedCursor:
      properties:
        decodedCursor:
          type: "string"
        encodedCursor:
          type: "string"
      type: "object"
    Base64UrlEncodedIdentifier:
      properties:
        encodedIdentifier:
          type: "string"
        identifier:
          type: "string"
      type: "object"
    CodesysDeploymentDefinition:
      allOf:
      - $ref: "#/components/schemas/DeploymentDefinition"
      - properties:
          applicationPath:
            type: "string"
        type: "object"
      type: "object"
    DataSpecificationContent:
      type: "object"
    DataTypeDefXsd:
      enum:
      - "ANY_URI"
      - "BASE64BINARY"
      - "BOOLEAN"
      - "BYTE"
      - "DATE"
      - "DATE_TIME"
      - "DECIMAL"
      - "DOUBLE"
      - "DURATION"
      - "FLOAT"
      - "GDAY"
      - "GMONTH"
      - "GMONTH_DAY"
      - "GYEAR"
      - "GYEAR_MONTH"
      - "HEX_BINARY"
      - "INT"
      - "INTEGER"
      - "LONG"
      - "NEGATIVE_INTEGER"
      - "NON_NEGATIVE_INTEGER"
      - "NON_POSITIVE_INTEGER"
      - "POSITIVE_INTEGER"
      - "SHORT"
      - "STRING"
      - "TIME"
      - "UNSIGNED_BYTE"
      - "UNSIGNED_INT"
      - "UNSIGNED_LONG"
      - "UNSIGNED_SHORT"
      type: "string"
    DeploymentDefinition:
      discriminator:
        propertyName: "deploymentType"
      properties:
        deploymentType:
          $ref: "#/components/schemas/DeploymentType"
      type: "object"
    DeploymentType:
      enum:
      - "DOCKER_CONTAINER"
      - "DOCKER_COMPOSE"
      - "KUBERNETES"
      - "CODESYS"
      type: "string"
    DeploymentVariableType:
      enum:
      - "TARGET_RESOURCE_ID"
      - "TARGET_RESOURCE_IP"
      type: "string"
    DockerComposeDeploymentDefinition:
      allOf:
      - $ref: "#/components/schemas/DeploymentDefinition"
      - properties:
          composeFile:
            type: "string"
          dotEnvFile:
            type: "string"
          envFiles:
            additionalProperties:
              type: "string"
            type: "object"
        type: "object"
      type: "object"
    DockerContainerDeploymentDefinition:
      allOf:
      - $ref: "#/components/schemas/DeploymentDefinition"
      - properties:
          environmentVariables:
            items:
              $ref: "#/components/schemas/ServiceOfferingEnvironmentVariable"
            type: "array"
          imageRepository:
            type: "string"
          imageTag:
            type: "string"
          labels:
            items:
              $ref: "#/components/schemas/DockerContainerLabel"
            type: "array"
          portMappings:
            items:
              $ref: "#/components/schemas/DockerContainerPortMapping"
            type: "array"
          restartPolicy:
            $ref: "#/components/schemas/DockerRestartPolicy"
          volumes:
            items:
              $ref: "#/components/schemas/DockerContainerVolume"
            type: "array"
        type: "object"
      type: "object"
    DockerContainerLabel:
      properties:
        name:
          type: "string"
        value:
          type: "object"
      type: "object"
    DockerContainerPortMapping:
      properties:
        containerPort:
          format: "int32"
          type: "integer"
        hostPort:
          format: "int32"
          type: "integer"
        protocol:
          type: "string"
      type: "object"
    DockerContainerVolume:
      properties:
        containerPath:
          type: "string"
        name:
          type: "string"
      type: "object"
    DockerRestartPolicy:
      enum:
      - "NO"
      - "ALWAYS"
      - "ON_FAILURE"
      - "UNLESS_STOPPED"
      type: "string"
    EmbeddedDataSpecification:
      properties:
        dataSpecification:
          $ref: "#/components/schemas/Reference"
        dataSpecificationContent:
          $ref: "#/components/schemas/DataSpecificationContent"
      type: "object"
    Extension:
      properties:
        name:
          type: "string"
        refersTo:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
        semanticId:
          $ref: "#/components/schemas/Reference"
        supplementalSemanticIds:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
        value:
          type: "string"
        valueType:
          $ref: "#/components/schemas/DataTypeDefXsd"
      type: "object"
    GetSubmodelsResult:
      properties:
        paging_metadata:
          $ref: "#/components/schemas/PagedResultPagingMetadata"
        result:
          items:
            $ref: "#/components/schemas/Submodel"
          type: "array"
      type: "object"
    GetSubmodelsValueOnlyResult:
      additionalProperties:
        type: "object"
      properties:
        empty:
          type: "boolean"
      type: "object"
    Key:
      properties:
        type:
          $ref: "#/components/schemas/KeyTypes"
        value:
          type: "string"
      type: "object"
    KeyTypes:
      enum:
      - "ANNOTATED_RELATIONSHIP_ELEMENT"
      - "ASSET_ADMINISTRATION_SHELL"
      - "BASIC_EVENT_ELEMENT"
      - "BLOB"
      - "CAPABILITY"
      - "CONCEPT_DESCRIPTION"
      - "DATA_ELEMENT"
      - "ENTITY"
      - "EVENT_ELEMENT"
      - "FILE"
      - "FRAGMENT_REFERENCE"
      - "GLOBAL_REFERENCE"
      - "IDENTIFIABLE"
      - "MULTI_LANGUAGE_PROPERTY"
      - "OPERATION"
      - "PROPERTY"
      - "RANGE"
      - "REFERABLE"
      - "REFERENCE_ELEMENT"
      - "RELATIONSHIP_ELEMENT"
      - "SUBMODEL"
      - "SUBMODEL_ELEMENT"
      - "SUBMODEL_ELEMENT_COLLECTION"
      - "SUBMODEL_ELEMENT_LIST"
      type: "string"
    KubernetesDeploymentDefinition:
      allOf:
      - $ref: "#/components/schemas/DeploymentDefinition"
      - properties:
          manifestFile:
            type: "string"
        type: "object"
      type: "object"
    LangStringNameType:
      properties:
        language:
          type: "string"
        text:
          type: "string"
      type: "object"
    LangStringTextType:
      properties:
        language:
          type: "string"
        text:
          type: "string"
      type: "object"
    MatchingResourceDTO:
      properties:
        capabilityServiceId:
          format: "uuid"
          type: "string"
        cluster:
          type: "boolean"
        resourceId:
          format: "uuid"
          type: "string"
      type: "object"
    Message:
      properties:
        code:
          type: "string"
        correlationId:
          type: "string"
        messageType:
          $ref: "#/components/schemas/MessageTypeEnum"
        text:
          type: "string"
        timestamp:
          type: "string"
      type: "object"
    MessageTypeEnum:
      enum:
      - "ERROR"
      - "EXCEPTION"
      - "INFO"
      - "WARNING"
      type: "string"
    ModellingKind:
      enum:
      - "INSTANCE"
      - "TEMPLATE"
      type: "string"
    PagedResultPagingMetadata:
      properties:
        cursor:
          example: "wJlCDLIl6KTWypN7T6vc6nWEmEYe99Hjf1XY1xmqV-M=#"
          type: "string"
      type: "object"
    Qualifier:
      properties:
        kind:
          $ref: "#/components/schemas/QualifierKind"
        semanticId:
          $ref: "#/components/schemas/Reference"
        supplementalSemanticIds:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
        type:
          type: "string"
        value:
          type: "string"
        valueId:
          $ref: "#/components/schemas/Reference"
        valueType:
          $ref: "#/components/schemas/DataTypeDefXsd"
      type: "object"
    QualifierKind:
      enum:
      - "CONCEPT_QUALIFIER"
      - "TEMPLATE_QUALIFIER"
      - "VALUE_QUALIFIER"
      type: "string"
    Reference:
      properties:
        keys:
          items:
            $ref: "#/components/schemas/Key"
          type: "array"
        referredSemanticId:
          $ref: "#/components/schemas/Reference"
        type:
          $ref: "#/components/schemas/ReferenceTypes"
      type: "object"
    ReferenceTypes:
      enum:
      - "EXTERNAL_REFERENCE"
      - "MODEL_REFERENCE"
      type: "string"
    RequirementLogicType:
      enum:
      - "ANY"
      - "ALL"
      type: "string"
    RequirementProperty:
      properties:
        name:
          type: "string"
        parentSubmodelsSemanticIds:
          items:
            type: "string"
          type: "array"
        semanticId:
          type: "string"
        value:
          type: "string"
      type: "object"
    Result:
      properties:
        messages:
          items:
            $ref: "#/components/schemas/Message"
          type: "array"
      type: "object"
    ServiceCategoryCreateResponse:
      properties:
        serviceCategoryId:
          format: "int64"
          type: "integer"
      type: "object"
    ServiceInstance:
      properties:
        capabilityServiceId:
          format: "uuid"
          type: "string"
        groupIds:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        metaData:
          additionalProperties:
            type: "string"
          type: "object"
        ports:
          items:
            format: "int32"
            type: "integer"
          type: "array"
        resourceId:
          format: "uuid"
          type: "string"
        serviceOfferingId:
          format: "uuid"
          type: "string"
        serviceOfferingVersionId:
          format: "uuid"
          type: "string"
        tags:
          items:
            type: "string"
          type: "array"
      type: "object"
    ServiceInstanceDetails:
      properties:
        deploymentCapabilityServiceId:
          format: "uuid"
          type: "string"
        groupIds:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        id:
          format: "uuid"
          type: "string"
        initialCreation:
          format: "date-time"
          type: "string"
        lastUpdate:
          format: "date-time"
          type: "string"
        metaData:
          additionalProperties:
            type: "string"
          type: "object"
        orderHistory:
          items:
            $ref: "#/components/schemas/ServiceOrder"
          type: "array"
        serviceOfferingId:
          format: "uuid"
          type: "string"
        serviceOfferingVersionId:
          format: "uuid"
          type: "string"
        serviceOptions:
          items:
            $ref: "#/components/schemas/ServiceOptionWithCurrentValue"
          type: "array"
        tags:
          items:
            type: "string"
          type: "array"
      type: "object"
    ServiceInstanceGroup:
      properties:
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
      type: "object"
    ServiceOffering:
      properties:
        coverImage:
          format: "byte"
          type: "string"
        description:
          type: "string"
        gitRepository:
          $ref: "#/components/schemas/ServiceOfferingGitRepository"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        serviceCategory:
          $ref: "#/components/schemas/ServiceOfferingCategory"
        serviceVendor:
          $ref: "#/components/schemas/ServiceVendor"
        shortDescription:
          type: "string"
        versions:
          items:
            $ref: "#/components/schemas/ServiceOfferingVersion"
          type: "array"
      type: "object"
    ServiceOfferingCategory:
      properties:
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
      type: "object"
    ServiceOfferingCreateOrUpdateRequest:
      properties:
        coverImage:
          format: "byte"
          type: "string"
        description:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        serviceCategoryId:
          format: "int64"
          type: "integer"
        serviceVendorId:
          format: "uuid"
          type: "string"
        shortDescription:
          type: "string"
      required:
      - "description"
      - "name"
      - "serviceCategoryId"
      - "serviceVendorId"
      - "shortDescription"
      type: "object"
    ServiceOfferingCreateResponse:
      properties:
        serviceOfferingId:
          format: "uuid"
          type: "string"
      type: "object"
    ServiceOfferingDTOApi:
      properties:
        coverImage:
          format: "byte"
          type: "string"
        description:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        name:
          type: "string"
        scmBased:
          type: "boolean"
        serviceCategoryId:
          format: "int64"
          type: "integer"
        serviceVendorId:
          format: "uuid"
          type: "string"
        shortDescription:
          type: "string"
        versions:
          items:
            $ref: "#/components/schemas/ServiceOfferingVersionDTOShort"
          type: "array"
      required:
      - "description"
      - "name"
      - "serviceCategoryId"
      - "serviceVendorId"
      - "shortDescription"
      type: "object"
    ServiceOfferingEnvironmentVariable:
      properties:
        key:
          type: "string"
        value:
          type: "object"
      type: "object"
    ServiceOfferingGitRepository:
      properties:
        gitPassword:
          type: "string"
        gitTagRegEx:
          type: "string"
        gitUsername:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        repositoryUrl:
          type: "string"
        serviceOffering:
          $ref: "#/components/schemas/ServiceOffering"
        serviceVendorId:
          format: "uuid"
          type: "string"
      type: "object"
    ServiceOfferingVersion:
      properties:
        created:
          format: "date-time"
          type: "string"
        deploymentDefinition:
          oneOf:
          - $ref: "#/components/schemas/CodesysDeploymentDefinition"
          - $ref: "#/components/schemas/DockerComposeDeploymentDefinition"
          - $ref: "#/components/schemas/DockerContainerDeploymentDefinition"
          - $ref: "#/components/schemas/KubernetesDeploymentDefinition"
        id:
          format: "uuid"
          type: "string"
        serviceOffering:
          $ref: "#/components/schemas/ServiceOffering"
        serviceOptionCategories:
          items:
            $ref: "#/components/schemas/ServiceOptionCategory"
          type: "array"
        servicePorts:
          items:
            format: "int32"
            type: "integer"
          type: "array"
        serviceRepositories:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        serviceRequirements:
          items:
            $ref: "#/components/schemas/ServiceRequirement"
          type: "array"
        version:
          type: "string"
      type: "object"
    ServiceOfferingVersionCreateResponse:
      properties:
        serviceOfferingId:
          format: "uuid"
          type: "string"
        serviceOfferingVersionId:
          format: "uuid"
          type: "string"
      type: "object"
    ServiceOfferingVersionDTOApi:
      properties:
        created:
          format: "date-time"
          readOnly: true
          type: "string"
        deploymentDefinition:
          oneOf:
          - $ref: "#/components/schemas/CodesysDeploymentDefinition"
          - $ref: "#/components/schemas/DockerComposeDeploymentDefinition"
          - $ref: "#/components/schemas/DockerContainerDeploymentDefinition"
          - $ref: "#/components/schemas/KubernetesDeploymentDefinition"
        id:
          format: "uuid"
          type: "string"
        serviceOfferingId:
          format: "uuid"
          type: "string"
        serviceOptionCategories:
          items:
            $ref: "#/components/schemas/ServiceOptionCategory"
          type: "array"
        servicePorts:
          items:
            format: "int32"
            type: "integer"
          type: "array"
        serviceRepositories:
          items:
            format: "uuid"
            type: "string"
          type: "array"
        serviceRequirements:
          items:
            $ref: "#/components/schemas/ServiceRequirement"
          type: "array"
        version:
          type: "string"
      required:
      - "deploymentDefinition"
      - "serviceOfferingId"
      - "version"
      type: "object"
    ServiceOfferingVersionDTOShort:
      properties:
        created:
          format: "date-time"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        version:
          type: "string"
      required:
      - "version"
      type: "object"
    ServiceOption:
      properties:
        defaultValue:
          type: "object"
        description:
          type: "string"
        editable:
          type: "boolean"
        key:
          type: "string"
        name:
          type: "string"
        optionType:
          $ref: "#/components/schemas/ServiceOptionType"
        relation:
          type: "string"
        required:
          type: "boolean"
        valueOptions:
          items:
            type: "string"
          type: "array"
        valueType:
          $ref: "#/components/schemas/ServiceOptionValueType"
      type: "object"
    ServiceOptionCategory:
      properties:
        id:
          format: "int64"
          type: "integer"
        name:
          type: "string"
        serviceOptions:
          items:
            $ref: "#/components/schemas/ServiceOption"
          type: "array"
      type: "object"
    ServiceOptionType:
      enum:
      - "ENVIRONMENT_VARIABLE"
      - "PORT_MAPPING"
      - "VOLUME"
      - "LABEL"
      - "STRING_REPLACE"
      type: "string"
    ServiceOptionValue:
      properties:
        serviceOptionId:
          type: "string"
        value:
          type: "object"
      type: "object"
    ServiceOptionValueType:
      enum:
      - "STRING"
      - "PASSWORD"
      - "BOOLEAN"
      - "NUMBER"
      - "INTEGER"
      - "DECIMAL"
      - "EMAIL"
      - "IP"
      - "ENUM"
      - "AUTO_GENERATED_UUID"
      - "PORT"
      - "VOLUME"
      - "AAS_SM_TEMPLATE"
      - "SYSTEM_VARIABLE"
      - "DEPLOYMENT_VARIABLE"
      type: "string"
    ServiceOptionWithCurrentValue:
      properties:
        currentValue:
          type: "object"
        defaultValue:
          type: "object"
        description:
          type: "string"
        editable:
          type: "boolean"
        key:
          type: "string"
        name:
          type: "string"
        optionType:
          $ref: "#/components/schemas/ServiceOptionType"
        relation:
          type: "string"
        required:
          type: "boolean"
        valueOptions:
          items:
            type: "string"
          type: "array"
        valueType:
          $ref: "#/components/schemas/ServiceOptionValueType"
      type: "object"
    ServiceOrder:
      properties:
        created:
          format: "date-time"
          type: "string"
        deploymentCapabilityServiceId:
          format: "uuid"
          type: "string"
        id:
          format: "uuid"
          type: "string"
        serviceInstanceId:
          format: "uuid"
          type: "string"
        serviceOptionValues:
          items:
            $ref: "#/components/schemas/ServiceOptionValue"
          type: "array"
        serviceOrderResult:
          $ref: "#/components/schemas/ServiceOrderResult"
      type: "object"
    ServiceOrderResult:
      enum:
      - "FAILED"
      - "SUCCESSFULL"
      type: "string"
    ServiceRepository:
      properties:
        address:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        password:
          type: "string"
        serviceVendorId:
          format: "uuid"
          type: "string"
        type:
          $ref: "#/components/schemas/ServiceRepositoryType"
        username:
          type: "string"
      type: "object"
    ServiceRepositoryCreateResponse:
      properties:
        serviceRepositoryId:
          format: "uuid"
          type: "string"
      type: "object"
    ServiceRepositoryDTOApiRead:
      properties:
        address:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        serviceVendorId:
          format: "uuid"
          type: "string"
        type:
          $ref: "#/components/schemas/ServiceRepositoryType"
        username:
          type: "string"
      type: "object"
    ServiceRepositoryType:
      enum:
      - "DOCKER_REGISTRY"
      type: "string"
    ServiceRequirement:
      properties:
        key:
          type: "string"
        logics:
          items:
            $ref: "#/components/schemas/ServiceRequirementLogic"
          type: "array"
        name:
          type: "string"
      type: "object"
    ServiceRequirementLogic:
      properties:
        properties:
          items:
            $ref: "#/components/schemas/RequirementProperty"
          type: "array"
        type:
          $ref: "#/components/schemas/RequirementLogicType"
      type: "object"
    ServiceVendor:
      properties:
        description:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        logo:
          format: "byte"
          type: "string"
        name:
          type: "string"
      type: "object"
    ServiceVendorCreateResponse:
      properties:
        serviceVendorId:
          format: "uuid"
          type: "string"
      type: "object"
    ServiceVendorDTOApi:
      properties:
        description:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        logo:
          format: "byte"
          type: "string"
        name:
          type: "string"
      type: "object"
    ServiceVendorDeveloper:
      properties:
        email:
          type: "string"
        firstName:
          type: "string"
        id:
          format: "uuid"
          type: "string"
        lastName:
          type: "string"
        username:
          type: "string"
      type: "object"
    Submodel:
      properties:
        administration:
          $ref: "#/components/schemas/AdministrativeInformation"
        category:
          type: "string"
        description:
          items:
            $ref: "#/components/schemas/LangStringTextType"
          type: "array"
        displayName:
          items:
            $ref: "#/components/schemas/LangStringNameType"
          type: "array"
        embeddedDataSpecifications:
          items:
            $ref: "#/components/schemas/EmbeddedDataSpecification"
          type: "array"
        extensions:
          items:
            $ref: "#/components/schemas/Extension"
          type: "array"
        id:
          type: "string"
        idShort:
          type: "string"
        kind:
          $ref: "#/components/schemas/ModellingKind"
        qualifiers:
          items:
            $ref: "#/components/schemas/Qualifier"
          type: "array"
        semanticId:
          $ref: "#/components/schemas/Reference"
        submodelElements:
          items:
            $ref: "#/components/schemas/SubmodelElement"
          type: "array"
        supplementalSemanticIds:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
      type: "object"
    SubmodelElement:
      properties:
        category:
          type: "string"
        description:
          items:
            $ref: "#/components/schemas/LangStringTextType"
          type: "array"
        displayName:
          items:
            $ref: "#/components/schemas/LangStringNameType"
          type: "array"
        embeddedDataSpecifications:
          items:
            $ref: "#/components/schemas/EmbeddedDataSpecification"
          type: "array"
        extensions:
          items:
            $ref: "#/components/schemas/Extension"
          type: "array"
        idShort:
          type: "string"
        qualifiers:
          items:
            $ref: "#/components/schemas/Qualifier"
          type: "array"
        semanticId:
          $ref: "#/components/schemas/Reference"
        supplementalSemanticIds:
          items:
            $ref: "#/components/schemas/Reference"
          type: "array"
      type: "object"
    SubmodelElementValue:
      type: "object"
    SubmodelValueOnly:
      properties:
        id:
          type: "string"
        idShort:
          type: "string"
        semanticId:
          type: "string"
        valuesOnlyMap:
          additionalProperties:
            $ref: "#/components/schemas/SubmodelElementValue"
          type: "object"
      type: "object"
    SystemVariable:
      properties:
        key:
          type: "string"
        name:
          type: "string"
        value:
          type: "object"
        valuePath:
          type: "string"
        valueSource:
          $ref: "#/components/schemas/SystemVariableValueSource"
      type: "object"
    SystemVariableValueSource:
      enum:
      - "APPLICATION_PROPERTIES"
      type: "string"
    User:
      properties:
        email:
          type: "string"
        firstName:
          type: "string"
        id:
          type: "string"
        lastName:
          type: "string"
        username:
          type: "string"
      type: "object"
  securitySchemes:
    bearer_auth:
      bearerFormat: "JWT"
      scheme: "bearer"
      type: "http"
    spring_oauth:
      description: "Oauth2 flow"
      flows:
        authorizationCode:
          authorizationUrl: ""
          refreshUrl: ""
          scopes: {}
          tokenUrl: ""
      type: "oauth2"
info:
