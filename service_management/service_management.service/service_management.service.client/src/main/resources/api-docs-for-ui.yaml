          format: "uuid"
          type: "string"
      responses:
        "200":
          description: "OK"
      summary: "Delete service instance group"
      tags:
      - "Service Instance Groups"
    get:
      operationId: "getServiceInstanceGroups"
      parameters:
      - in: "query"
        name: "filterById"
        required: false
        schema:
          format: "uuid"
          type: "string"
      responses:
        "200":
          content:
            '*/*':
              schema:
                items:
                  $ref: "#/components/schemas/ServiceInstanceGroup"
                type: "array"
          description: "OK"
      summary: "Get service instance groups"
      tags:
      - "Service Instance Groups"
    post:
      operationId: "createServiceInstanceGroup"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInstanceGroup"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceInstanceGroup"
          description: "OK"
      summary: "Create service instance group"
      tags:
      - "Service Instance Groups"
  /services/instances/groups/{serviceInstanceGroupId}:
    put:
      operationId: "createOrUpdateServiceInstanceGroup"
      parameters:
      - in: "path"
        name: "serviceInstanceGroupId"
        required: true
        schema:
          format: "uuid"
          type: "string"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInstanceGroup"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ServiceInstanceGroup"
          description: "OK"
      summary: "Create or update service instance group"
      tags:
      - "Service Instance Groups"
  /services/instances/{serviceInstanceId}:
    delete:
      operationId: "deleteServiceInstance"
      parameters:
      - in: "path"
        name: "serviceInstanceId"
        required: true
